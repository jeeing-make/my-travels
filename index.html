<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --bg: #e4e3de;
      --card: #eeede9;
      --frame-light: #d9d7cc;
      --line: #2a2a2a;
      --muted: #9b998f;
      --frame: #5b5b59;
      --ink: #2a2a2a;
      --white: #ffffff;
      --chip-inactive: #dcdbd6;
      --chip-gray: #8e8e8c;
      --shadow-light: #ffffff;
      --shadow-dark: #bfbdb1;
      --accent: #e9f542;
      --accent-deep: #767c07;
      --accent-soft: #f5f8c0;
      --up: #e85c4a;
      --yellow: #ffd79a;
      --yellow-soft: #fff1dd;
      --sky: #a9c8ff;
      --sky-soft: #e8f0ff;
      --pink: #f6d3cd;
      --pink-deep: #e85c4a;
      --green: #bfe8c9;
      --green-deep: #3b9e63;
      --tw: #c98a3a;
      --tw-bg: #fdeedc;
      --neu-out: 0 2px 8px rgba(42,42,37,0.08);
      --neu-out-sm: 0 1px 4px rgba(42,42,37,0.08);
      --neu-in: inset 0 1px 3px rgba(42,42,37,0.12);
      --neu-out-accent: 0 3px 10px rgba(42,42,37,0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Manrope", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-weight: 300;
      background: var(--frame);
      color: var(--line);
      padding: 12px;
      position: relative;
      overflow-x: hidden;
    }
    [data-lucide], .lucide { width: 1em; height: 1em; stroke-width: 1.5; vertical-align: -0.15em; pointer-events: none; } /* 아이콘(svg)이 클릭을 가로채서 버튼이 안 눌리는 문제 방지 - 항상 버튼 전체가 클릭되게 */
    h1, .card h2, .modal-box h3 {
      font-weight: 400;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 4px;
      letter-spacing: -0.5px;
      font-weight: 400;
    }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; font-weight: 400; text-align: center; }

    .wrap { max-width: 1400px; margin: 0 auto; position: relative; }

    /* 반짝이 별 장식 (고정, 움직이지 않음) */
    .sparkle { position: absolute; color: var(--accent-soft); pointer-events: none; z-index: 0; }

    .title-row { text-align: left; position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
    .title-main { margin: 0; line-height: 1.1; }
    .highlight-box {
      font-weight: 400;
      font-size: 19px;
      letter-spacing: -0.3px;
      color: var(--line);
      display: inline-block;
    }

    .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; position: relative; z-index: 1; }
    .board-col { display: flex; flex-direction: column; gap: 24px; }
    @media (max-width: 760px) { .top-row { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: none;
      border-radius: 24px;
      padding: 30px 32px;
      box-shadow: none;
    }
    .card h2, .report-plain h2 {
      font-size: 15px;
      font-weight: 400;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card h2 .range, .report-plain h2 .range { font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; background: var(--white); border: none; border-radius: 999px; padding: 4px 11px; box-shadow: none; }
    .report-plain { padding: 4px 8px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    .item-list { display: flex; flex-direction: column; gap: 13px; max-height: 420px; overflow-y: auto; }
    .today-deadline-divider { height: 2px; background: var(--accent); border-radius: 999px; flex: none; margin: 0 2px; }
    .item-row {
      border: none;
      border-radius: 16px;
      padding: 16px 19px;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--white);
      box-shadow: var(--neu-out-sm);
    }
    .item-row.overdue { background: var(--pink); }
    .item-main { flex: 1; min-width: 0; }
    .item-name { font-weight: 400; }
    .item-meta { color: var(--muted); font-size: 11px; display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 6px; }
    .tag { background: var(--white); color: var(--ink); border: none; border-radius: 999px; padding: 2px 10px; font-weight: 400; box-shadow: none; }
    .tag.priority { background: var(--accent-soft); color: var(--accent-deep); box-shadow: none; }
    .tag.done { background: var(--chip-gray); color: var(--white); }
    .tag.inprogress { background: var(--up); color: var(--white); }
    .quick-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .qbtn {
      width: 32px; height: 32px; border-radius: 999px; border: none; background: var(--white);
      cursor: pointer; font-size: 13px; line-height: 1; padding: 0; font-weight: 400; color: var(--line);
      display: flex; align-items: center; justify-content: center; box-shadow: var(--neu-out-sm);
    }
    .qbtn.ok { background: var(--ink); color: #fff; }
    .qbtn.hold { background: var(--white); color: var(--pink-deep); }
    .qbtn:active { box-shadow: var(--neu-in); }
    .qbtn svg, .qbtn i { pointer-events: none; } /* 아이콘(svg)이 클릭을 가로채지 않고 버튼 전체(원 전체)가 항상 클릭되게 */

    .form-row { display: flex; flex-direction: column; gap: 16px; }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 400; text-transform: lowercase; }
    input, select, textarea {
      width: 100%;
      padding: 10px 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      background: var(--white);
      color: var(--line);
      font-family: "Pretendard", sans-serif;
      box-shadow: var(--neu-in);
    }
    button.primary {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      box-shadow: var(--neu-out-accent);
    }
    button.primary:active { box-shadow: var(--neu-in); }
    button.primary:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    .msg { font-size: 12px; margin-top: 8px; font-weight: 400; }
    .msg.ok { color: var(--green-deep); }
    .msg.err { color: var(--pink-deep); }
    .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
    .refresh-wrap { text-align: center; margin-top: 18px; position: relative; z-index: 1; }
    .refresh-btn { background: var(--white); border: none; color: var(--muted); font-size: 12px; font-weight: 400; padding: 8px 16px; cursor: pointer; border-radius: 999px; box-shadow: var(--neu-out-sm); }
    .refresh-btn:active { box-shadow: var(--neu-in); }

    .week-nav { display: flex; gap: 4px; }
    .week-nav-btn {
      font-size: 11px; font-weight: 400;
      background: var(--chip-inactive); border: none; border-radius: 999px; color: var(--line);
      padding: 5px 11px; cursor: pointer; white-space: nowrap; box-shadow: none;
    }
    .week-nav-btn:active { background: var(--white); box-shadow: var(--neu-out-sm); }

    .tab-row { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 9px 0; border-radius: 999px; border: none;
      background: var(--chip-inactive); color: var(--muted); font-size: 12px; font-weight: 400; cursor: pointer;
      box-shadow: none;
    }
    .tab-btn.active { background: var(--white); color: var(--line); box-shadow: var(--neu-out-sm); }

    /* ===== 외곽 프레임 - 단일 패널 구조 (폴더탭/clip-path 없음) ===== */
    .app-shell {
      background: var(--bg);
      border-radius: 28px;
      padding: 32px;
      position: relative;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .app-header-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 500;
      margin: 0;
      letter-spacing: -0.3px;
      color: var(--ink);
    }
    .app-date {
      font-size: 13px;
      font-weight: 400;
      color: var(--chip-gray);
      white-space: nowrap;
    }
    .app-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav-pill {
      font-size: 13px; font-weight: 400;
      background: var(--chip-inactive); color: var(--frame); border: none;
      border-radius: 999px; padding: 9px 16px; cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background 150ms, color 150ms;
    }
    .nav-pill.active { background: var(--ink); color: var(--white); }
    .icon-btn {
      width: 36px; height: 36px; flex: none;
      border-radius: 999px; border: none; background: var(--chip-inactive); color: var(--frame);
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 150ms, color 150ms;
    }
    .icon-btn:hover { background: var(--ink); color: var(--white); }
    .page-section { display: none; }
    .page-section.active { display: block; }
    @media (max-width: 760px) {
      .app-shell { padding: 20px; }
      .app-header { height: auto; padding-bottom: 12px; }
      .nav-pill { padding: 7px 10px; font-size: 11px; }
      .app-date { display: none; }
    }

    .soon-note { font-size: 12px; color: var(--tw); background: var(--tw-bg); border: none; border-radius: 12px; padding: 10px 12px; font-weight: 400; box-shadow: var(--neu-in); }

    /* 캘린더 (월~금, 구글캘린더식 막대) */
    .cal-card { margin-top: 16px; }
    .cal-head-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
    .cal-head-cell { text-align: center; font-size: 12px; font-weight: 400; color: var(--muted); border: none; border-radius: 10px; padding: 6px 0; background: var(--card); box-shadow: var(--neu-out-sm); }
    .cal-head-cell.today { background: var(--accent); color: var(--line); box-shadow: var(--neu-in); }

    .cal-section-label { font-size: 12px; font-weight: 400; color: var(--muted); margin: 6px 0 3px; display: flex; align-items: center; gap: 5px; }
    .series-range {
      font-size: 11px; color: var(--accent-deep); font-weight: 400; font-family: "Pretendard", sans-serif;
      background: var(--accent-soft); border: none; border-radius: 999px; padding: 2px 9px;
    }

    .progress-track { background: var(--card); border: none; box-shadow: var(--neu-in); border-radius: 999px; overflow: hidden; height: 16px; }
    .progress-fill { background: linear-gradient(90deg, var(--accent-deep), var(--accent)); height: 100%; }
    .proj-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .proj-chips { display: flex; gap: 5px; flex-wrap: wrap; }

    /* 주간 보고서 - 브랜드>프로젝트>할일 그리드(노션/리니어 타임라인 스타일) */
    .report-toolbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .report-toolbar-title { display: flex; align-items: baseline; gap: 10px; flex: none; }
    .report-week-label { font-size: 18px; font-weight: 500; color: var(--ink); white-space: nowrap; }
    .report-toolbar-title .range {
      font-size: 13px; color: var(--chip-gray); font-weight: 400; background: none;
      border-radius: 0; padding: 0; box-shadow: none; white-space: nowrap;
    }
    .report-search-wrap { flex: 1; min-width: 140px; display: flex; justify-content: center; }
    .report-search-wrap input {
      width: 100%; max-width: 360px; height: 40px; background: var(--white); border: none;
      border-radius: 999px; padding: 0 18px; font-size: 13px; box-shadow: none;
    }
    .report-toolbar-right { display: flex; align-items: center; gap: 10px; flex: none; }
    .week-nav-group {
      display: flex; align-items: center; gap: 2px; background: var(--chip-inactive);
      border-radius: 999px; padding: 4px;
    }
    .week-nav-group .week-nav-btn {
      background: transparent; box-shadow: none; border: none; color: var(--frame);
      font-size: 12px; font-weight: 400; padding: 7px 12px; border-radius: 999px; cursor: pointer;
      display: flex; align-items: center; transition: background 150ms, color 150ms;
    }
    .week-nav-group .week-nav-btn:hover { background: var(--ink); color: var(--white); }
    .week-nav-group .week-nav-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .report-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .report-chip {
      background: var(--chip-inactive); color: var(--frame); border: none; border-radius: 999px;
      font-size: 12px; font-weight: 400; padding: 7px 14px; cursor: pointer; transition: background 150ms, color 150ms;
    }
    .report-chip.active { background: var(--white); color: var(--ink); }

    .report-main { display: flex; align-items: flex-start; gap: 24px; }
    .report-grid-card {
      flex: 1; min-width: 0; position: relative; background: var(--card);
      border-radius: 20px; overflow: hidden; box-shadow: none; border: none;
    }
    .report-summary {
      flex: none; width: 280px; background: var(--card); border-radius: 20px;
      padding: 24px; box-shadow: none; border: none;
    }
    @media (max-width: 980px) {
      .report-main { flex-direction: column; }
      .report-summary { width: 100%; }
    }

    .report-week-sub {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
      font-size: 11px; color: var(--chip-gray); font-weight: 400; margin-bottom: 2px;
      padding: 0 8px;
    }
    .report-week-sub .wk1 { grid-column: 1 / 6; }
    .report-week-sub .wk2 { grid-column: 6 / 11; }

    .report-grid-decor {
      position: absolute; left: 0; right: 0; top: 56px; bottom: 0;
      display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
      z-index: 0; pointer-events: none; padding: 0 8px;
    }
    .report-grid-decor > div.today { background: rgba(233,245,66,0.08); }
    .report-grid-decor > div.week-start { border-left: 1px solid rgba(0,0,0,0.1); }

    .report-grid-head {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
      height: 38px; padding: 0 8px;
    }
    .report-grid-head-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
    }
    .report-grid-head-cell.week-start { border-left: 1px solid rgba(0,0,0,0.1); }
    .report-grid-head-cell .wd { font-size: 11px; color: var(--chip-gray); font-weight: 400; }
    .report-grid-head-cell .dn {
      font-size: 13px; font-weight: 500; color: var(--ink);
      width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 999px;
    }
    .report-grid-head-cell.today .dn { background: var(--accent); color: var(--ink); }

    .report-row-brand {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      height: 32px; padding: 0 16px; background: var(--bg);
      border-top: 1px solid rgba(0,0,0,0.06); cursor: pointer;
    }
    .report-brand-cell { display: flex; align-items: center; gap: 8px; }
    .report-brand-icon {
      width: 20px; height: 20px; border-radius: 999px; flex: none; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 500; color: var(--ink);
    }
    .report-brand-name { font-size: 14px; font-weight: 500; color: var(--ink); }
    .report-brand-count {
      background: var(--chip-inactive); color: var(--frame); font-size: 11px; font-weight: 400;
      border-radius: 999px; padding: 1px 7px;
    }
    .report-row-brand .report-brand-chevron {
      color: var(--chip-gray); transition: transform 150ms; display: flex;
    }
    .report-row-brand.collapsed .report-brand-chevron { transform: rotate(-90deg); }
    .report-brand-projects.collapsed { display: none; }

    .report-row-project {
      position: relative; z-index: 1;
      border-top: 1px solid rgba(0,0,0,0.04);
      padding: 4px 8px 6px;
    }
    .report-project-head { display: flex; align-items: center; gap: 8px; padding: 0 8px; margin-bottom: 4px; }
    .report-project-cell {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; color: var(--ink);
      background: var(--card); box-shadow: var(--neu-out-sm); border-radius: 999px;
      padding: 4px 12px 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
    }
    .report-project-cell::before {
      content: ''; width: 6px; height: 6px; border-radius: 999px; flex: none;
    }
    .report-project-memo, .report-project-memo-ro {
      margin: 0 8px 6px; font-size: 11px; padding: 6px 10px; border-radius: 9px;
      line-height: 1.6; max-height: 110px; overflow-y: auto;
    }
    .report-project-memo {
      border: none; box-shadow: var(--neu-in); background: var(--card); color: var(--ink);
      outline: none; cursor: text; white-space: pre-wrap; word-break: break-word;
    }
    .report-project-memo-ro {
      box-shadow: var(--neu-in); background: var(--card); color: var(--muted);
      white-space: pre-wrap; word-break: break-word;
    }
    .report-project-memo .memo-line, .report-project-memo-ro .memo-line {
      display: flex; align-items: flex-start; gap: 5px; min-height: 1.5em;
    }
    .memo-checkbox { margin-top: 3px; flex: none; accent-color: var(--ink); cursor: pointer; }
    .report-project-memo-ro .memo-checkbox { cursor: default; }
    .memo-line-text { flex: 1; min-width: 0; }
    .memo-line-text.done { text-decoration: line-through; color: var(--muted); opacity: 0.7; }
    .proj-c0::before { background: #5B8DEF; }
    .proj-c1::before { background: #9B6BD6; }
    .proj-c2::before { background: #D68A3C; }
    .proj-c3::before { background: #6A70D6; }
    .proj-c4::before { background: #3AAFC4; }
    .proj-c5::before { background: #8A7355; }
    .report-project-track {
      position: relative; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px; padding: 0 8px; align-content: start;
    }
    .report-bar2 {
      border: none; box-shadow: none; border-radius: 7px; padding: 0 10px;
      font-size: 12px; font-weight: 400; height: 24px; display: flex; align-items: center;
      gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: default;
      background: var(--white); color: var(--ink); position: relative;
      transition: box-shadow 150ms;
    }
    .report-bar2.done { background: var(--chip-gray); color: var(--white); }
    .report-bar2.delay { padding-left: 8px; }
    .report-bar2.delay::before {
      content: ''; width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--up);
    }
    /* 분야가 "경영진"인 아이템만 빨간색으로 강조: 완료는 빨간 배경, 진행중/진행전은 흰 배경+빨간 테두리 */
    .report-bar2.mgmt.done { background: var(--up); color: var(--white); }
    .report-bar2.mgmt:not(.done) { background: var(--white); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--up); }
    .report-bar2.has-link { background: var(--accent-soft) !important; color: var(--accent-deep) !important; }
    .report-bar2[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: 100%; left: 0; margin-bottom: 6px;
      background: var(--ink); color: var(--white); font-size: 11px; font-weight: 400;
      padding: 6px 10px; border-radius: 6px; white-space: nowrap; z-index: 20;
    }

    .report-summary-pct { font-size: 40px; font-weight: 500; color: var(--ink); font-family: "Manrope", "Pretendard", sans-serif; margin-bottom: 8px; }
    .report-summary-bar { height: 8px; border-radius: 999px; background: var(--chip-inactive); overflow: hidden; margin-bottom: 24px; }
    .report-summary-bar-fill { height: 100%; background: var(--accent); }
    .report-summary-h { font-size: 12px; font-weight: 500; color: var(--chip-gray); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.02em; }
    .report-summary-brand-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 6px 0; }
    .report-summary-brand-row .n { color: var(--chip-gray); font-size: 12px; }
    .report-summary-delay-row {
      display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0; cursor: default;
    }
    .report-summary-delay-row::before { content: ''; width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--up); }
    .report-summary-delay-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .report-summary-delay-row .dt { color: var(--chip-gray); flex: none; }
    .report-summary-block { margin-bottom: 24px; }
    .report-summary-block:last-child { margin-bottom: 0; }

    .deliv-chip {
      font-size: 11px; font-weight: 400; color: var(--accent-deep); background: var(--accent-soft);
      border: none; border-radius: 999px; padding: 1px 9px; text-decoration: none;
    }
    .slack-preview-loading { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .modal-link-preview { margin-top: 8px; padding: 10px 12px; border-radius: 10px; box-shadow: var(--neu-in); background: var(--card); }
    .modal-link-preview .slack-card-img { max-height: 160px; object-fit: contain; }
    .report-link-edit-row { display: flex; gap: 8px; }
    .report-link-edit-row input {
      flex: 1; min-width: 0; font-size: 13px; padding: 10px 12px; border: none; border-radius: 10px;
      box-shadow: var(--neu-in); background: var(--card); color: var(--ink); font-family: inherit;
    }
    .report-link-edit-row button.save {
      flex: none; padding: 0 16px; border-radius: 999px; border: none; background: var(--ink); color: #fff;
      box-shadow: var(--neu-out-accent); cursor: pointer; font-size: 13px; font-weight: 400;
    }
    .slack-card {
      margin-top: 6px; border: none; border-radius: 10px; box-shadow: var(--neu-out-sm);
      padding: 8px 10px; background: var(--card); max-width: 360px;
    }
    .slack-card-head { font-size: 11px; font-weight: 400; color: var(--tw); margin-bottom: 4px; }
    .slack-card-text { font-size: 12px; white-space: pre-wrap; margin-bottom: 6px; }
    .slack-card-text a { color: var(--accent-deep); font-weight: 400; text-decoration: underline; }
    .slack-card-img { max-width: 100%; border-radius: 6px; border: none; box-shadow: var(--neu-in); margin-bottom: 6px; display: block; }
    .cal-section-label.tw-label { color: var(--tw); }

    .tw-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .tw-cell { border: none; box-shadow: var(--neu-out-sm); border-radius: 10px; padding: 6px; background: var(--tw-bg); min-height: 44px; }
    .tw-chip { font-size: 11px; margin-bottom: 3px; }
    .tw-chip .time { font-weight: 400; color: var(--tw); }

    .bar-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 26px;
      gap: 4px 6px;
      border: none;
      box-shadow: var(--neu-in);
      border-radius: 10px;
      padding: 6px;
      min-height: 38px;
      background: var(--card);
    }
    .cal-bar {
      border: none;
      box-shadow: var(--neu-out-sm);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 400;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }
    .cal-bar.dragging { opacity: 0.4; }
    .bar-grid.drag-over { background: var(--accent-soft); }
    .cal-bar .m { font-weight: 400; color: var(--muted); }
    .cal-bar.st-pending, .report-bar.st-pending,
    .cal-bar.st-none, .report-bar.st-none { background: var(--white); color: var(--ink); }
    .cal-bar.st-progress, .report-bar.st-progress { background: var(--up); color: var(--white); }
    .cal-bar.st-done, .report-bar.st-done { background: var(--chip-gray); color: var(--white); }

    /* 편집 모달 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(34, 34, 34, 0.35);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card); border: none; border-radius: 28px; padding: 30px; width: 480px; max-width: 92vw;
      max-height: 88vh; overflow-y: auto;
      box-shadow: var(--neu-out);
    }
    .modal-box h3 { margin: 0 0 20px; font-size: 15px; }
    .modal-box .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
    }
    .modal-box .form-row > div.wide { grid-column: 1 / -1; }

    .pkg-step-row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .pkg-step-row .pkg-step-name { flex: 2; min-width: 90px; }
    .pkg-step-row .pkg-step-days { width: 48px; flex: none; text-align: center; }
    .pkg-step-row .pkg-step-field { flex: 1; min-width: 70px; }
    .pkg-step-row .pkg-step-order { font-size: 11px; color: var(--muted); font-weight: 400; width: 16px; flex: none; text-align: center; }
    .pkg-step-parallel-label {
      font-size: 10px; color: var(--muted); font-weight: 400; display: flex;
      align-items: center; gap: 3px; flex: none; white-space: nowrap;
    }
    .pkg-step-row .qbtn.pkg-move-btn { width: 22px; height: 22px; font-size: 10px; flex: none; background: var(--card); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 999px; border: none; box-shadow: none; background: var(--chip-inactive); color: var(--line); cursor: pointer; font-size: 13px; font-weight: 400; }
    .modal-actions button.save { background: var(--ink); color: #fff; box-shadow: var(--neu-out-accent); }

    /* 프로젝트 검색기 - 간트 차트 (아이템당 바 1개: 내용+기간 / 옆에 분야 첫글자 동그라미) */
    .gantt-chart-bg {
      position: relative; border: none; border-radius: 10px; box-shadow: var(--neu-in);
      background-color: var(--card); overflow: visible; padding: 10px 0;
    }
    .gantt-bar-label-out {
      position: absolute; top: 3px; bottom: 3px; display: flex; align-items: center;
      font-size: 11px; font-weight: 400; white-space: nowrap; color: var(--line);
      padding-left: 6px; pointer-events: none; z-index: 2;
    }
    /* 간트차트 마지막 5칸은 오른쪽으로 빼면 차트 밖으로 나가서 왼쪽으로 뺌 */
    .gantt-bar-label-out.to-left { padding-left: 0; padding-right: 6px; justify-content: flex-end; }
    .gantt-today-line { position: relative; }
    .gantt-row { margin-bottom: 0; }
    .gantt-track {
      position: relative; height: 30px; margin: 3px 0;
    }
    .gantt-bar {
      position: absolute; top: 3px; bottom: 3px; border: none; box-shadow: var(--neu-out-sm);
      border-radius: 6px; font-size: 11px; font-weight: 400; display: flex;
      align-items: center; gap: 5px; padding: 0 8px; white-space: nowrap; overflow: hidden;
      cursor: pointer; min-width: 6px;
    }
    .gantt-bar .n { overflow: hidden; text-overflow: ellipsis; }
    .gantt-bar .r { font-weight: 400; color: var(--muted); flex-shrink: 0; }
    .gantt-bar.g-done { background: var(--chip-gray); color: var(--white); }
    .gantt-bar.g-progress { background: var(--up); color: var(--white); }
    .gantt-bar.g-pending, .gantt-bar.g-blocked, .gantt-bar.g-hold { background: var(--white); color: var(--ink); }
    /* 막대 안 "(분야)" 표시 - 동그라미로 막대를 가리던 것 대신 글자 앞에 분야별 색 배지로 */
    .bar-field { flex: none; font-size: 9px; font-weight: 600; padding: 0 4px; border-radius: 4px; line-height: 1.7; }
    .field-c0 { background: #E3EEFF; color: #2A5DB0; }
    .field-c1 { background: #F3E8FF; color: #7A3FC9; }
    .field-c2 { background: #FFE8EF; color: #C23B6B; }
    .field-c3 { background: #FFF0DB; color: #B06A1A; }
    .field-c4 { background: #E1F7F0; color: #1E8F72; }
    .field-c5 { background: #EAEAFB; color: #4A4FB0; }
    /* 오늘 칸은 세로 전체를 위 날짜줄의 "오늘" 배지와 같은 색으로 */
    .gantt-today-col { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); z-index: 0; }
    .gantt-day-line {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: rgba(61,65,72,0.14); z-index: 1; pointer-events: none;
    }
    .gantt-day-line.week { width: 2px; background: rgba(61,65,72,0.4); }
    .gantt-week-info { font-size: 11px; font-weight: 400; color: var(--muted); margin-bottom: 6px; }
    .gantt-date-row { position: relative; height: 14px; margin-bottom: 4px; }
    .gantt-date-label {
      position: absolute; top: 0; transform: translateX(-50%);
      font-size: 9px; font-weight: 400; color: var(--muted); white-space: nowrap;
    }
    .gantt-date-label.week { color: var(--line); font-weight: 500; }
    .gantt-date-label.today {
      color: var(--accent-deep); font-weight: 700; background: var(--accent-soft);
      border-radius: 5px; padding: 0 3px;
    }
    .gantt-bar { cursor: grab; }
    .gantt-bar.dragging { opacity: 0.4; }
    .gantt-chart-bg.drag-over { background-color: var(--accent-soft); }

    /* 간트차트 밑 아이템 목록: 체크(완료) / 이름+날짜 / 메모 */
    .proj-item-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .proj-item-row {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-radius: 10px; box-shadow: var(--neu-out-sm); background: var(--card);
    }
    .proj-item-row.done { opacity: 0.5; }
    .proj-item-row.done .proj-item-name { text-decoration: line-through; }
    .proj-item-check { width: 16px; height: 16px; flex: none; accent-color: var(--ink); }
    .proj-item-main { flex: 1; min-width: 0; }
    .proj-item-name { font-size: 12px; font-weight: 400; color: var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-item-date { font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .proj-item-memo { width: 150px; flex: none; font-size: 11px; padding: 7px 9px; }
    @media (max-width: 480px) { .proj-item-memo { width: 100px; } }
    .proj-item-check-dot {
      width: 14px; height: 14px; flex: none; border-radius: 50%;
      box-shadow: var(--neu-in); background: var(--card);
    }
    .proj-item-check-dot.done { background: var(--ink); box-shadow: none; }
    .proj-item-memo-ro { width: 150px; flex: none; font-size: 11px; color: var(--muted); padding: 7px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 480px) { .proj-item-memo-ro { width: 100px; } }
    .proj-item-add-btn { margin-top: 8px; width: 100%; }

    /* 회의록 분석 - 제안 미리보기 */
    .notes-row { border: none; box-shadow: var(--neu-out-sm); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: var(--card); }
    .notes-row-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .notes-row-top input[type="checkbox"] { width: auto; flex: none; }
    .notes-row-top input[type="text"] { flex: 1; font-weight: 400; padding: 6px 9px; }
    .notes-row-top .qbtn { flex: none; }
    .notes-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .notes-row-grid > * { padding: 6px 9px; font-size: 12px; }
    .notes-row-grid .wide { grid-column: 1 / -1; }


    /* 결과물 링크 호버 미리보기 */
    .link-hover-popover {
      position: fixed; z-index: 200; max-width: 280px; display: none;
      background: var(--card); border: none; border-radius: 10px;
      padding: 9px 11px; box-shadow: var(--neu-out); pointer-events: none;
    }

    /* 주간보고서 아이템 클릭 - 전체화면 고정 미리보기 */
    .report-preview-overlay { z-index: 150; }
    .report-preview-box {
      position: relative; width: 92vw; max-width: 760px; height: 86vh;
      display: flex; flex-direction: column;
    }
    .report-preview-close {
      position: absolute; top: -10px; right: -10px; width: 34px; height: 34px;
      border-radius: 999px; border: none; background: var(--line); color: #fff;
      font-weight: 400; font-size: 15px; cursor: pointer; box-shadow: var(--neu-out-sm);
    }
    .report-preview-head { margin-bottom: 10px; padding-right: 20px; }
    .report-preview-head .item-name { font-size: 18px; }
    .report-preview-body { flex: 1; overflow-y: auto; }
    .report-preview-body .slack-card { max-width: none; }
    .report-preview-body .slack-card-img { max-width: 100%; max-height: 50vh; object-fit: contain; }

    @media print {
      body { padding: 0; background: #fff; }
      @page { size: landscape; margin: 10mm; }
      .app-nav, .icon-btn, .refresh-wrap, .title-row, #page-dashboard, #page-project,
      .week-nav-group, .report-share-btn { display: none !important; }
      #page-report { display: block !important; }
      .card { box-shadow: none; border: 1px solid #000; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app-shell" id="appShell">
    <div class="app-header">
      <div class="app-header-left">
        <h1 class="app-title">DASHBOARD</h1>
        <span class="app-date" id="topSub">불러오는 중...</span>
      </div>
      <div class="app-header-right">
        <nav class="app-nav">
          <button class="nav-pill active" id="pagenav-dashboard" onclick="switchPage('dashboard')"><i data-lucide="layout-dashboard"></i>대시보드</button>
          <button class="nav-pill" id="pagenav-project" onclick="switchPage('project')"><i data-lucide="search"></i>프로젝트 검색</button>
          <button class="nav-pill" id="pagenav-report" onclick="switchPage('report')"><i data-lucide="clipboard-list"></i>주간 보고서</button>
        </nav>
        <button class="icon-btn" type="button" onclick="load();" title="새로고침"><i data-lucide="refresh-cw"></i></button>
      </div>
    </div>

    <div id="loading" class="loading">데이터를 불러오는 중...</div>

    <div id="app" style="display:none;">
    <div id="page-dashboard" class="page-section active">
      <div class="top-row">
        <div class="board-col">
          <div class="card">
            <h2>금주 메인업무</h2>
            <div id="mainTasks" class="item-list"></div>
          </div>
          <div class="card">
            <h2>오늘 진행 업무</h2>
            <div id="today" class="item-list"></div>
          </div>
          <div class="card">
            <h2>기한 초과 미완료 업무</h2>
            <div id="overdue" class="item-list"></div>
          </div>
        </div>

        <div class="board-col">
          <div class="card">
            <h2>새 아이템 생성</h2>
            <div class="tab-row">
              <button class="tab-btn active" id="tab-item" onclick="switchCreateTab('item')">아이템 생성</button>
              <button class="tab-btn" id="tab-series" onclick="switchCreateTab('series')">시리즈 생성</button>
              <button class="tab-btn" id="tab-package" onclick="switchCreateTab('package')">패키지 생성</button>
              <button class="tab-btn" id="tab-notes" onclick="switchCreateTab('notes')">회의록 분석</button>
            </div>

            <div id="create-item-form" class="form-row">
              <div>
                <label>브랜드</label>
                <select id="f-brand"></select>
              </div>
              <div>
                <label>분야</label>
                <select id="f-field"></select>
              </div>
              <div>
                <label>시리즈 (선택)</label>
                <select id="f-series"><option value="">미지정</option></select>
              </div>
              <div>
                <label>일정</label>
                <input id="f-date" type="date">
              </div>
              <div>
                <label>아이템명 추가 (위 브랜드/분야/시리즈/일정이 전부 동일하게 들어감)</label>
                <div style="display:flex; gap:6px;">
                  <input id="f-item-input" type="text" placeholder="아이템명 입력 후 추가" style="flex:1;" onkeydown="if (event.key === 'Enter') { event.preventDefault(); addItemName(); }">
                  <button type="button" class="week-nav-btn" onclick="addItemName()">+ 추가</button>
                </div>
                <div id="f-item-list" class="item-list" style="max-height:160px; margin-top:8px;">
                  <div class="empty">추가된 아이템이 없습니다.</div>
                </div>
              </div>
              <button class="primary" id="f-submit" onclick="submitItems()">아이템 생성</button>
              <div id="f-msg" class="msg"></div>
            </div>

            <div id="create-series-form" class="form-row" style="display:none;">
              <div>
                <label>시리즈명</label>
                <input id="s-series" type="text" placeholder="예: 2026 윈터 캠페인">
              </div>
              <div>
                <label>브랜드</label>
                <select id="s-brand"></select>
              </div>
              <div>
                <label>일정(시작일)</label>
                <input id="s-date" type="date">
              </div>
              <div>
                <label>아이템명 추가</label>
                <div style="display:flex; gap:6px;">
                  <input id="s-item-input" type="text" placeholder="아이템명 입력 후 추가" style="flex:1;">
                  <button type="button" class="week-nav-btn" onclick="addSeriesItemName()">+ 추가</button>
                </div>
                <div id="s-item-list" class="item-list" style="max-height:160px; margin-top:8px;">
                  <div class="empty">추가된 아이템이 없습니다.</div>
                </div>
              </div>
              <button class="primary" id="s-submit" onclick="submitSeries()">시리즈 아이템 일괄 생성</button>
              <div id="s-msg" class="msg"></div>
            </div>

            <div id="create-package-form" class="form-row" style="display:none;">
              <div>
                <label>시리즈명</label>
                <input id="pkg-series-name" type="text" placeholder="예: 2026 윈터 광고 캠페인">
              </div>
              <div>
                <label>패키지 유형</label>
                <div style="display:flex; gap:6px;">
                  <select id="pkg-create-type" style="flex:1;" onchange="updatePkgPreview_()"></select>
                  <button type="button" class="week-nav-btn" onclick="openPkgManage()"><i data-lucide="settings"></i> 관리</button>
                </div>
              </div>
              <div>
                <label>브랜드</label>
                <select id="p-brand"></select>
              </div>
              <div>
                <label>시작일</label>
                <input id="p-date" type="date" onchange="updatePkgPreview_()">
              </div>
              <div id="pkg-preview" class="soon-note" style="display:none;"></div>
              <button class="primary" id="pkg-submit" onclick="submitPackage()">패키지 생성</button>
              <div id="pkg-msg" class="msg"></div>
            </div>

            <div id="create-notes-form" class="form-row" style="display:none;">
              <div>
                <label>회의록 / 대화 내용 붙여넣기</label>
                <textarea id="notes-text" rows="7" placeholder="회의록 내용을 붙여넣으면 AI가 새로 만들 업무(프로젝트/아이템/일정)를 찾아서 제안해줘. 확인하고 필요한 것만 선택해서 추가하면 돼."></textarea>
              </div>
              <button class="primary" id="notes-analyze" onclick="analyzeNotes()"><i data-lucide="sparkles"></i> 분석하기</button>
              <div id="notes-msg" class="msg"></div>
              <div id="notes-preview"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card cal-card">
        <h2>
          <span>스케줄 <span class="range" id="weekRange"></span></span>
          <span class="week-nav">
            <button class="week-nav-btn" onclick="loadWeek(weekOffset - 1)"><i data-lucide="chevron-left"></i> 저번주</button>
            <button class="week-nav-btn" onclick="loadWeek(0)">이번주</button>
            <button class="week-nav-btn" onclick="loadWeek(weekOffset + 1)">다음주 <i data-lucide="chevron-right"></i></button>
          </span>
        </h2>
        <div id="calHeader" class="cal-head-row"></div>
        <div class="cal-section-label tw-label"><i data-lucide="calendar"></i> 티치웍스</div>
        <div id="calTeachworks" class="tw-grid"></div>
        <div id="seriesSections"></div>
      </div>
    </div>

    <div id="page-project" class="page-section">
      <div class="card">

<script>
  var itemsById = {}; // id -> item (오늘/기한초과/메인/스케줄에 나온 적 있는 전체 아이템, 로컬 재계산용)

  var weekOffset = 0; // 0=이번주, -1=저번주, 1=다음주 (스케줄 섹션 전용)
  var reportWeekOffset = 0; // 주간 보고서 전용 (이번주 기준 오프셋)
  var reportDays = []; // 보고서용 7일치 날짜 문자열 (월~일, 단일 주)
  var reportWeekOptions = []; // [{offset,label}] - 검색용
  var reportWeek1Start = ''; // 현재 로드된 보고서의 주 월요일 (공유 링크용)
  var reportBrandFilter_ = null; // null = 전체, 아니면 선택된 브랜드명
  var reportCollapsedBrands_ = {}; // 브랜드명 -> 접힘 여부
  var reportLastData_ = null; // 마지막으로 받은 보고서 데이터(필터/접기 재렌더용)
  var reportProjectMemos_ = {}; // 시리즈(프로젝트)명 -> 메모 (먼데이와 무관한 보고서 전용 메모)

  (function () {
    var lucideTimer = null;
    function refreshLucide_() {
      clearTimeout(lucideTimer);
      lucideTimer = setTimeout(function () {
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
      }, 60);
    }
    function initLucideObserver_() {
      refreshLucide_();
      if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(refreshLucide_).observe(document.body, { childList: true, subtree: true });
      }
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initLucideObserver_);

      initLucideObserver_();
    }
  })();

  var INIT_PAGE = '<?= initPage ?>';
  var INIT_WEEK = '<?= initWeek ?>';
  var INIT_VIEW = '<?= initView ?>';
  var INIT_ITEM_ID = '<?= initItemId ?>';
  var INIT_TOKEN = '<?= initToken ?>';
  var INIT_SERIES = '<?= initSeries ?>';
  var IS_SHARED_VIEW = ('<?= isSharedView ?>' === 'true');
  var VIEW_ONLY = false;
  var webAppUrlCache_ = '';
  var ganttSeriesName = ''; // 현재 간트차트에 표시중인 시리즈(프로젝트)명
  var ganttItems = []; // 해당 시리즈의 전체 아이템 요약 목록 (연쇄 일정 변경 계산용)
  var ganttModalActive = false; // 지금 열려있는 편집 모달이 간트차트에서 열린 것인지 여부
  var ganttChartStart_ = ''; // 현재 렌더링된 간트차트의 기준 시작일 (드래그 위치 계산용)
  var ganttChartTotalDays_ = 0; // 현재 렌더링된 간트차트의 전체 일수(영업일 수) (드래그 위치 계산용)
  var ganttChartDays_ = []; // 현재 렌더링된 간트차트의 주말 제외 날짜 목록 (인덱스->날짜, 드래그 위치 계산용)
  var ganttDraggingId = null; // 간트차트에서 지금 드래그 중인 아이템 id

  /** 모든 날짜 입력(type=date, 현재/이후 생성되는 것 포함)에서 주말 선택을 막고 다음 평일로 자동 보정 - capture 단계라 각 input의 onchange보다 먼저 실행됨 */
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.tagName === 'INPUT' && t.type === 'date' && t.value && isWeekendClient_(t.value)) {
      t.value = rollToBusinessDayClient_(t.value);
    }
  }, true);

  function switchPage(page) {
    ['dashboard', 'project', 'report'].forEach(function (p) {
      document.getElementById('page-' + p).classList.toggle('active', p === page);
      document.getElementById('pagenav-' + p).classList.toggle('active', p === page);
    });
    if (page === 'report' && !document.getElementById('reportBody').innerHTML) {
      loadReportWeek(0);
    }
  }

  function load() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    google.script.run.withSuccessHandler(render).withFailureHandler(renderError).getDashboardData(INIT_TOKEN);
  }

  /** load()와 달리 로딩화면을 보여주지 않고 최신 데이터만 조용히 받아와 다시 그림 (완료/보류 처리 후 동기화 확인용) */
  function silentRefresh_() {
    google.script.run.withSuccessHandler(render).withFailureHandler(function (err) {
      console.warn('조용한 새로고침 실패: ' + (err.message || err));
    }).getDashboardData(INIT_TOKEN);
  }

  function renderError(err) {
    document.getElementById('loading').innerText = '오류: ' + (err.message || err);
  }

  function esc(s) {
    return (s || '').toString().replace(/</g, '&lt;');
  }

  function tagStatusClass_(status) {
    if (status === '완료') return ' done';
    if (status === '작업 중') return ' inprogress';
    return '';
  }

  var REPORT_EXCLUDED_BRANDS_ = ['KIB', '개인']; // 주간 보고서에서 제외할 브랜드

  function itemRow(it, overdue, editable) {
    var actions = '<div class="quick-actions">' +
      '<button class="qbtn ok" title="완료" onclick="event.stopPropagation();quickAction(\'' + it.id + '\',\'complete\')"><i data-lucide=\'check\'></i></button>' +
      '<button class="qbtn hold" title="보류" onclick="event.stopPropagation();quickAction(\'' + it.id + '\',\'hold\')"><i data-lucide="x"></i></button>' +
      '</div>';
    var rowAttrs = editable ? ' onclick="openModal(\'' + it.id + '\')" style="cursor:pointer;"' : '';
    return '<div class="item-row' + (overdue ? ' overdue' : '') + '"' + rowAttrs + '>' +
      '<div class="item-main">' +
        '<div class="item-name">' + esc(it.name) + '</div>' +
        '<div class="item-meta">' +
          (it.brand ? '<span class="tag">' + esc(it.brand) + '</span>' : '') +
          (it.field ? '<span class="tag">' + esc(it.field) + '</span>' : '') +
          (it.status ? '<span class="tag' + tagStatusClass_(it.status) + '">' + esc(it.status) + '</span>' : '') +
          (it.priority ? '<span class="tag priority">' + esc(it.priority) + '</span>' : '') +
          '<span>' + esc(it.start || '-') + ' ~ ' + esc(it.end || '-') + '</span>' +
        '</div>' +
      '</div>' + actions +
    '</div>';
  }

  function renderList(elId, items, overdue, editable) {
    var el = document.getElementById(elId);
    if (!items || items.length === 0) {
      el.innerHTML = '<div class="empty">해당 업무가 없습니다.</div>';
      return;
    }
    if (elId === 'today') {
      // 오늘 진행 업무: 데드라인이 오늘인 항목(위) / 미래인 항목(아래) 경계에 연두색 구분선 한 줄
      var today = todayStrClient_();
      var sawTodayDeadline = false;
      var dividerInserted = false;
      el.innerHTML = items.map(function (it) {
        var isTodayDeadline = (it.end || it.start) === today;
        var prefix = '';
        if (isTodayDeadline) sawTodayDeadline = true;
        if (!dividerInserted && !isTodayDeadline && sawTodayDeadline) {
          prefix = '<div class="today-deadline-divider"></div>';
          dividerInserted = true;
        }
        return prefix + itemRow(it, overdue, editable);
      }).join('');
      return;
    }
    el.innerHTML = items.map(function (it) { return itemRow(it, overdue, editable); }).join('');
  }

  function quickAction(id, kind) {
    id = String(id);
    var statusLabel = kind === 'complete' ? '완료' : '보류';
    if (itemsById[id]) {
      itemsById[id].status = statusLabel;
      recomputeAndRender();
    } else {
      // itemsById에 없는 경우(동기화가 어긋난 경우) 낙관적 업데이트를 건너뛰고 서버 응답 후 전체 새로고침으로 바로잡음
      console.warn('quickAction: itemsById에 없는 id', id);
    }

    var fn = kind === 'complete' ? 'completeItem' : 'holdItem';
    google.script.run
      .withSuccessHandler(function () {
        // 낙관적 업데이트가 어떤 이유로든 어긋났을 수 있으니, 서버가 실제로 처리했다는 게 확인되면 최신 데이터로 조용히(로딩화면 없이) 다시 맞춤
        silentRefresh_();
      })
      .withFailureHandler(function (err) {
        alert('오류: ' + (err.message || err) + ' (새로고침해서 다시 확인해줘)');
        load();
      })[fn](id);
  }

  function todayStrClient_() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function daysBetween(a, b) {
    var d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
    return Math.round((d2 - d1) / 86400000);
  }

  /** ===================== 영업일(주말 제외) 날짜 유틸 - 패키지 일정 미리보기용 (서버 로직과 동일) ===================== */
  function dayOfWeekClient_(dateStr) {
    return new Date(dateStr + 'T00:00:00').getDay(); // 0=일 ... 6=토
  }
  function isWeekendClient_(dateStr) {
    var dow = dayOfWeekClient_(dateStr);
    return dow === 0 || dow === 6;
  }
  function rollToBusinessDayClient_(dateStr) {
    while (isWeekendClient_(dateStr)) dateStr = addDays(dateStr, 1);
    return dateStr;
  }
  function addBusinessDaysClient_(dateStr, n) {
    var d = dateStr;
    var remaining = Math.abs(n);
    var step = n >= 0 ? 1 : -1;
    while (remaining > 0) {
      d = addDays(d, step);
      if (!isWeekendClient_(d)) remaining--;
    }
    return d;
  }
  /** start~end(달력일, 주말 포함) 사이의 평일만 날짜 배열로 반환 - 간트차트 주말 제외 렌더링용 */
  function buildWeekdayDays_(start, end) {
    var days = [];
    if (!start) return days;
    if (!end || end < start) end = start;
    var d = start;
    var guard = 0;
    while (d <= end && guard < 3650) {
      if (!isWeekendClient_(d)) days.push(d);
      d = addDays(d, 1);
      guard++;
    }
    if (days.length === 0) days.push(rollToBusinessDayClient_(start));
    return days;
  }
  /** start~end(달력일) 사이의 평일 개수(양끝 포함) - 간트 드래그시 기존 영업일 기간 유지용 */
  function countBusinessDaysClient_(start, end) {
    if (!start) return 1;
    if (!end || end < start) end = start;
    var count = 0;
    var d = start;
    var guard = 0;
    while (d <= end && guard < 3650) {
      if (!isWeekendClient_(d)) count++;
      d = addDays(d, 1);
      guard++;
    }
    return Math.max(1, count);
  }

  function weekRangeClient_(offsetWeeks) {
    offsetWeeks = offsetWeeks || 0;
    var now = new Date();
    var dow = now.getDay();
    var diffToMon = (dow === 0) ? -6 : (1 - dow);
    var monday = new Date(now); monday.setDate(now.getDate() + diffToMon + offsetWeeks * 7);
    var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    function fmt(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    return { start: fmt(monday), end: fmt(sunday) };
  }

  function loadWeek(offset) {
    weekOffset = offset;
    google.script.run.withSuccessHandler(onWeekLoaded).withFailureHandler(function (err) {
      alert('오류: ' + (err.message || err));
    }).getWeekScheduleAt(offset);
  }

  function onWeekLoaded(schedule) {
    if (!lastData) return;
    lastData.schedule = schedule;
    (schedule.items || []).forEach(function (it) { itemsById[it.id] = it; });
    document.getElementById('weekRange').innerText = schedule.range.start + ' ~ ' + schedule.range.end;
    renderCalendar(schedule);
  }

  function recomputeAndRender() {
    // 메모 입력칸에 포커스가 있는 중(저장 전)에 다른 동작으로 보고서가 통째로 다시 그려지면
    // 아직 blur로 저장되지 않은 입력값이 날아가 버리는 문제가 있어서, 그 동안은 보고서 재렌더를 건너뜀.
    var activeEl = document.activeElement;
    var isEditingReportMemo = !!(activeEl && activeEl.classList && activeEl.classList.contains('report-project-memo'));
    if (reportLastData_ && !isEditingReportMemo) { renderReportGrid_(reportLastData_); renderReportSummary_(reportLastData_); }
    if (!lastData) return;
    var today = todayStrClient_();
    var week = weekRangeClient_(0); // 금주 메인 업무는 항상 실제 이번주 기준
    var schedWeek = weekRangeClient_(weekOffset); // 스케줄 섹션은 현재 보고 있는 주 기준
    var all = Object.keys(itemsById).map(function (k) { return itemsById[k]; });
    var visible = all.filter(function (it) { return it.status !== '보류'; });

    lastData.today = visible.filter(function (it) {
      var end = it.end || it.start;
      return it.start && it.start <= today && today <= end && it.status !== '완료';
    }).sort(function (a, b) {
      // 데드라인(완료일)이 오늘인 것(급함)이 위로, 데드라인이 미래인 것은 아래로
      var ea = a.end || a.start, eb = b.end || b.start;
      return ea < eb ? -1 : (ea > eb ? 1 : 0);
    });
    lastData.overdue = visible.filter(function (it) {
      return it.end && it.end < today && it.status !== '완료';
    });
    lastData.schedule.range = schedWeek;
    lastData.schedule.items = visible.filter(function (it) {
      var end = it.end || it.start;
      return it.start && it.start <= schedWeek.end && end >= schedWeek.start;
    });

    renderList('today', lastData.today, false, true);
    renderList('overdue', lastData.overdue, true, true);
    renderTopProjects(computeTopProjects_(visible, week));
    document.getElementById('weekRange').innerText = lastData.schedule.range.start + ' ~ ' + lastData.schedule.range.end;
    renderCalendar(lastData.schedule);
  }

  /** 이번주(실제 현재주) 진행중인 프로젝트(시리즈)를 아이템 수 많은 순으로 최대 3개 뽑기 */
  function computeTopProjects_(visibleItems, week) {
    var bySeries = {}; // key -> { count, brands:{} }
    visibleItems.forEach(function (it) {
      var end = it.end || it.start;
      if (!it.start || !(it.start <= week.end && end >= week.start)) return;
      var keys = (it.series && it.series.trim())
        ? it.series.split(',').map(function (s) { return s.trim(); }).filter(Boolean)
        : [];
      keys.forEach(function (key) {
        if (!bySeries[key]) bySeries[key] = { count: 0, brands: {} };
        bySeries[key].count++;
        if (it.brand) bySeries[key].brands[it.brand] = true;
      });
    });
    var ranges = (lastData && lastData.schedule && lastData.schedule.seriesRanges) || {};
    var list = Object.keys(bySeries).map(function (key) {
      return {
        name: key,
        count: bySeries[key].count,
        brands: Object.keys(bySeries[key].brands),
        range: ranges[key] || null
      };
    });
    list.sort(function (a, b) { return b.count - a.count; });
    return list.slice(0, 3);
  }

  function renderTopProjects(projects) {
    var el = document.getElementById('mainTasks');
    if (!projects || projects.length === 0) {
      el.innerHTML = '<div class="empty">이번주 진행중인 프로젝트가 없습니다.</div>';
      return;
    }
    el.innerHTML = projects.map(function (p) {
      var rangeTxt = p.range ? (fmtShort_(p.range.start) + ' ~ ' + fmtShort_(p.range.end)) : '-';
      return '<div class="item-row">' +
        '<div class="item-main">' +
          '<div class="item-name"><i data-lucide="clapperboard"></i> ' + esc(p.name) + '</div>' +
          '<div class="item-meta">' +
            '<span class="series-range">' + esc(rangeTxt) + '</span>' +
            p.brands.map(function (b) { return '<span class="tag">' + esc(b) + '</span>'; }).join('') +
            '<span>아이템 ' + p.count + '개</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function hostnameOf_(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
  }

  function renderWeeklyReport(scheduleData) {
    document.getElementById('reportRange').innerText = scheduleData.range.start + ' ~ ' + scheduleData.range.end;
    var el = document.getElementById('reportBody');
    var items = (scheduleData.items || []).filter(function (it) { return it.status !== '보류'; });
    if (items.length === 0) {
      el.innerHTML = '<div class="empty">해당 주 업무가 없습니다.</div>';
      return;
    }

    // 브랜드 > 시리즈(프로젝트) 순으로 그룹
    var byBrand = {};
    var brandOrder = [];
    items.forEach(function (it) {
      var b = it.brand || '미지정';
      if (!byBrand[b]) { byBrand[b] = {}; brandOrder.push(b); }
      var seriesKeys = (it.series && it.series.trim())
        ? it.series.split(',').map(function (s) { return s.trim(); }).filter(Boolean)
        : ['기타'];
      seriesKeys.forEach(function (sk) {
        if (!byBrand[b][sk]) byBrand[b][sk] = [];
        byBrand[b][sk].push(it);
      });
    });
    brandOrder.sort();

    el.innerHTML = brandOrder.map(function (brand) {
      var seriesObj = byBrand[brand];
      var seriesKeys = Object.keys(seriesObj).sort(function (a, b) {
        if (a === '기타') return 1;
        if (b === '기타') return -1;
        return a < b ? -1 : (a > b ? 1 : 0);
      });
      var seriesHtml = seriesKeys.map(function (sk) {
        var rows = seriesObj[sk].map(function (it) {
          var linkHtml = '';
          if (it.deliverable) {
            if (isSlackLink_(it.deliverable)) {
              linkHtml = '<div class="slack-preview" data-slack-url="' + esc(it.deliverable) + '">' +
                '<div class="slack-preview-loading"><i data-lucide="link"></i> 슬랙 미리보기 불러오는 중...</div></div>';
            } else {
              linkHtml = ' <a class="deliv-chip" href="' + esc(it.deliverable) + '" target="_blank" rel="noopener"><i data-lucide="link"></i> ' + esc(hostnameOf_(it.deliverable)) + '</a>';
            }
          }
          var isSlackBlock = it.deliverable && isSlackLink_(it.deliverable);
          return '<div class="item-row"><div class="item-main">' +
            '<div class="item-name">' + esc(it.name) + '</div>' +
            '<div class="item-meta"><span class="tag' + tagStatusClass_(it.status) + '">' + esc(it.status || '미지정') + '</span>' + (isSlackBlock ? '' : linkHtml) + '</div>' +
            (isSlackBlock ? linkHtml : '') +
            '</div></div>';
        }).join('');
        var label = sk === '기타' ? '기타' : ('<i data-lucide="clapperboard"></i> ' + esc(sk));
        return '<div class="report-series"><div class="report-series-label">' + label + '</div>' + rows + '</div>';
      }).join('');
      return '<div class="report-brand"><div class="report-brand-label"><span class="brand-dot"></span>' + esc(brand) + '</div><div class="report-brand-body">' + seriesHtml + '</div></div>';
    }).join('');

    loadSlackPreviews_(el);
  }

  function isSlackLink_(url) {
    return /slack\.com\/archives\//.test(url || '');
  }

  function loadSlackPreviews_(containerEl) {
    var nodes = containerEl.querySelectorAll('.slack-preview[data-slack-url]');
    for (var i = 0; i < nodes.length; i++) {
      (function (node) {
        var url = node.dataset.slackUrl;
        google.script.run
          .withSuccessHandler(function (preview) { renderSlackPreviewInto_(node, url, preview); })
          .withFailureHandler(function (err) { renderSlackPreviewInto_(node, url, { ok: false, error: err.message || err }); })
          .getSlackPreview(url);
      })(nodes[i]);
    }
  }

  function renderSlackPreviewInto_(node, url, preview) {
    if (!preview || !preview.ok) {
      node.innerHTML = '<a class="deliv-chip" href="' + esc(url) + '" target="_blank" rel="noopener"><i data-lucide="link"></i> 슬랙 링크 (미리보기 불가)</a>';
      return;
    }
    var html = '<div class="slack-card">';
    html += '<div class="slack-card-head"><i data-lucide="message-circle"></i> ' + esc(preview.user || '') + (preview.channel ? ' · #' + esc(preview.channel) : '') + '</div>';
    if (preview.textHtml) html += '<div class="slack-card-text">' + preview.textHtml + '</div>';
    else if (preview.text) html += '<div class="slack-card-text">' + esc(preview.text) + '</div>';
    if (preview.imageDataUri) html += '<img class="slack-card-img" src="' + preview.imageDataUri + '">';
    html += '<a class="deliv-chip" href="' + esc(url) + '" target="_blank" rel="noopener">슬랙에서 보기 <i data-lucide="external-link"></i></a>';
    html += '</div>';
    node.innerHTML = html;
  }

  function fmtShort_(dateStr) {
    if (!dateStr) return '-';
    var parts = dateStr.split('-');
    return parts.length === 3 ? (Number(parts[1]) + '/' + Number(parts[2])) : dateStr;
  }

  function dayLabel(dateStr) {
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var d = new Date(dateStr + 'T00:00:00');
    return days[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  /** 겹치는 기간의 막대들을 레인(줄)에 배치 (daysArr: 날짜 문자열 배열, 임의 길이) */
  function layoutBarsGeneric_(items, daysArr) {
    var numDays = daysArr.length;
    var withIdx = items.map(function (it) {
      var end = it.end || it.start;
      var s = it.start < daysArr[0] ? daysArr[0] : it.start;
      var e = end > daysArr[numDays - 1] ? daysArr[numDays - 1] : end;
      return { it: it, s: s, e: e, startIdx: daysBetween(daysArr[0], s), endIdx: daysBetween(daysArr[0], e) };
    }).filter(function (x) { return x.endIdx >= 0 && x.startIdx < numDays && x.startIdx <= x.endIdx; });

    withIdx.forEach(function (x) {
      x.startIdx = Math.max(0, x.startIdx);
      x.endIdx = Math.min(numDays - 1, x.endIdx);
    });
    withIdx.sort(function (a, b) { return a.startIdx - b.startIdx; });

    var lanes = [];
    withIdx.forEach(function (x) {
      var laneIdx = -1;
      for (var i = 0; i < lanes.length; i++) {
        if (lanes[i] < x.startIdx) { laneIdx = i; break; }
      }
      if (laneIdx === -1) { laneIdx = lanes.length; lanes.push(-1); }
      lanes[laneIdx] = x.endIdx;
      x.lane = laneIdx;
    });

    return { bars: withIdx, laneCount: Math.max(1, lanes.length) };
  }

  /** 기존 호환용: 월~금 5일 주간 캘린더 레이아웃 */
  function layoutBars_(items) {
    return layoutBarsGeneric_(items, weekDays);
  }

  /** 주말을 건너뛴 날짜 목록(daysArr, 연속 아님)에 막대 배치 - 날짜->인덱스 맵으로 정렬 */
  function layoutBarsByDayList_(items, daysArr) {
    var numDays = daysArr.length;
    var dayIndex = {};
    daysArr.forEach(function (d, i) { dayIndex[d] = i; });

    function snapForward_(d) {
      var guard = 0;
      while (dayIndex[d] === undefined && d < daysArr[numDays - 1] && guard < 10) { d = addDays(d, 1); guard++; }
      return d;
    }
    function snapBackward_(d) {
      var guard = 0;
      while (dayIndex[d] === undefined && d > daysArr[0] && guard < 10) { d = addDays(d, -1); guard++; }
      return d;
    }

    var withIdx = items.map(function (it) {
      var end = it.end || it.start;
      var s = it.start < daysArr[0] ? daysArr[0] : it.start;
      var e = end > daysArr[numDays - 1] ? daysArr[numDays - 1] : end;
      s = snapForward_(s);
      e = snapBackward_(e);
      return { it: it, s: s, e: e, startIdx: dayIndex[s], endIdx: dayIndex[e] };
    }).filter(function (x) { return x.startIdx !== undefined && x.endIdx !== undefined && x.startIdx <= x.endIdx; });

    withIdx.sort(function (a, b) { return a.startIdx - b.startIdx; });

    var lanes = [];
    withIdx.forEach(function (x) {
      var laneIdx = -1;
      for (var i = 0; i < lanes.length; i++) {
        if (lanes[i] < x.startIdx) { laneIdx = i; break; }
      }
      if (laneIdx === -1) { laneIdx = lanes.length; lanes.push(-1); }
      lanes[laneIdx] = x.endIdx;
      x.lane = laneIdx;
    });

    return { bars: withIdx, laneCount: Math.max(1, lanes.length) };
  }

  /** ===================== 결과물 링크 호버 미리보기 ===================== */
  var linkPreviewCache_ = {};
  var linkPreviewHideTimer_ = null;

  function jsAttrEscape_(s) {
    return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function getLinkPopover_() {
    var pop = document.getElementById('linkPreviewPopover');
    if (!pop) {
      pop = document.createElement('div');
      pop.id = 'linkPreviewPopover';
      pop.className = 'link-hover-popover';
      document.body.appendChild(pop);
    }
    return pop;
  }

  function positionLinkPopover_(pop, ev) {
    var x = ev.clientX + 16, y = ev.clientY + 12;
    var maxX = window.innerWidth - 300, maxY = window.innerHeight - 220;
    if (x > maxX) x = ev.clientX - 300;
    if (y > maxY) y = Math.max(8, maxY);
    pop.style.left = Math.max(8, x) + 'px';
    pop.style.top = Math.max(8, y) + 'px';
  }

  function showLinkPreview(ev, url) {
    clearTimeout(linkPreviewHideTimer_);
    var pop = getLinkPopover_();
    positionLinkPopover_(pop, ev);
    pop.style.display = 'block';
    if (linkPreviewCache_[url]) {
      renderLinkPreviewInto_(pop, url, linkPreviewCache_[url]);
      return;
    }
    pop.innerHTML = '<div class="slack-preview-loading"><i data-lucide="link"></i> 미리보기 불러오는 중...</div>';
    google.script.run
      .withSuccessHandler(function (preview) {
        linkPreviewCache_[url] = preview;
        renderLinkPreviewInto_(pop, url, preview);
      })
      .withFailureHandler(function (err) {
        renderLinkPreviewInto_(pop, url, { ok: false, error: err.message || err });
      })
      .getLinkPreview(url);
  }

  function moveLinkPreview(ev) {
    var pop = document.getElementById('linkPreviewPopover');
    if (pop && pop.style.display === 'block') positionLinkPopover_(pop, ev);
  }

  function hideLinkPreview() {
    linkPreviewHideTimer_ = setTimeout(function () {
      var pop = document.getElementById('linkPreviewPopover');
      if (pop) pop.style.display = 'none';
    }, 80);
  }

  function renderLinkPreviewInto_(pop, url, preview) {
    if (!preview || !preview.ok) {
      pop.innerHTML = '<div class="slack-card-head"><i data-lucide="link"></i> 미리보기 불가</div><a class="deliv-chip" href="' + esc(url) + '" target="_blank" rel="noopener">열기 <i data-lucide="external-link"></i></a>';
      return;
    }
    var html = '<div class="slack-card-head">' + (preview.kind === 'slack' ? '<i data-lucide="message-circle"></i> ' : '<i data-lucide="link"></i> ') + esc(preview.title || '') + '</div>';
    if (preview.image) html += '<img class="slack-card-img" src="' + esc(preview.image) + '">';
    if (preview.description) html += '<div class="slack-card-text">' + esc(preview.description) + '</div>';
    html += '<a class="deliv-chip" href="' + esc(url) + '" target="_blank" rel="noopener">열기 <i data-lucide="external-link"></i></a>';
    pop.innerHTML = html;
  }

  /** 주간보고서 아이템 클릭 - 전체화면 고정 미리보기 (수정 불가, X로만 닫힘) */

    } else {
      body.innerHTML = '<div class="slack-preview-loading"><i data-lucide="link"></i> 미리보기 불러오는 중...</div>';
      google.script.run
        .withSuccessHandler(function (preview) {

          renderLinkPreviewInto_(body, it.deliverable, preview);

  /** 주간보고서 아이템 클릭(소유자 전용) - 업무 전체 수정 모달 대신, 링크 추가+바로가기+미리보기만 있는 가벼운 창 */

  function refreshReportLinkEditPreview_() {
    var input = document.getElementById('reportLinkEditInput');

  /** ===================== 주간보고서 링크 공유 (PDF 대신, 수정 불가 보기 전용 링크) ===================== */
  function weekOffsetFromMondayStr_(mondayStr) {
    var curMonday = weekRangeClient_(0).start;
    return Math.round(daysBetween(curMonday, mondayStr) / 7);

  function buildAndShowShareLink_(baseUrl) {
