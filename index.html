    }
  }

  /** ===================== 주간 보고서 (이번주+다음주, 브랜드->프로젝트) ===================== */
  function weekMondayOf_(offsetWeeks) {
    var r = weekRangeClient_(offsetWeeks);
    return r.start;
  }

  function weekLabel_(offsetWeeks) {
    var mondayStr = weekMondayOf_(offsetWeeks);
    var d = new Date(mondayStr + 'T00:00:00');
    var month = d.getMonth() + 1;
    var weekOfMonth = Math.ceil(d.getDate() / 7);
    var r = weekRangeClient_(offsetWeeks);
    return month + '월 ' + weekOfMonth + '주차 (' + fmtShort_(r.start) + '~' + fmtShort_(r.end) + ')';
  }

  function buildReportWeekOptions_() {
    reportWeekOptions = [];
    for (var o = -8; o <= 12; o++) {
      reportWeekOptions.push({ offset: o, label: weekLabel_(o) });
    }
    var dl = document.getElementById('report-week-list');
    if (dl) dl.innerHTML = reportWeekOptions.map(function (x) { return '<option value="' + esc(x.label) + '"></option>'; }).join('');
  }

  function searchReportWeek() {
    var input = document.getElementById('report-week-input');
    var val = input.value.trim();
    if (!val) return;
    var match = reportWeekOptions.filter(function (x) { return x.label === val; })[0];
    if (!match) {
      // "10월 4주차" 처럼 일부만 입력해도 매칭
      match = reportWeekOptions.filter(function (x) { return x.label.indexOf(val) === 0 || x.label.indexOf(val) !== -1; })[0];
    }
    if (!match) {
      alert('해당 주차를 찾을 수 없습니다. 목록에서 선택해줘.');
      return;
    }
    loadReportWeek(match.offset);
  }

  function loadReportWeek(offset) {
    // 공유(보기 전용) 링크에서는 미래 주차를 못 보게 막음 - 과거/이번주까지만 이동 가능
    if (VIEW_ONLY && offset > 0) return;
    reportWeekOffset = offset;
    var input = document.getElementById('report-week-input');
    if (input) input.value = weekLabel_(offset);
    google.script.run.withSuccessHandler(renderTwoWeekReport).withFailureHandler(function (err) {
      alert('오류: ' + (err.message || err));
    }).getTwoWeekReport(offset);
  }

  function reportVisibleItems_(report) {
    return (report.items || []).filter(function (it) {
      if (it.status === '보류') return false;
      if (REPORT_EXCLUDED_BRANDS_.indexOf(it.brand) !== -1) return false;
      if (reportBrandFilter_ && (it.brand || '미지정') !== reportBrandFilter_) return false;
      return true;
    });
  }

  function reportInitial_(name) {
    return (name || '?').trim().charAt(0).toUpperCase();
  }

  /** 공유(VIEW_ONLY) 화면에서는 링크가 있는 아이템만 클릭(미리보기)되고, 링크가 없으면 아무 동작도 하지 않음.
   *  소유자 화면에서는 항상 클릭 시 수정 모달이 열림(링크 추가 포함). */
  function reportItemClickMeta_(id, deliverable) {
    var onclickCall = VIEW_ONLY
      ? (deliverable ? 'openReportItemPreview(\'' + id + '\')' : '')
      : 'openReportItemLinkEditor_(\'' + id + '\')';
    return {
      onclickAttr: onclickCall ? ' onclick="event.stopPropagation();' + onclickCall + '"' : '',
      cursor: onclickCall ? 'cursor:pointer;' : ''
    };
  }

  /** 프로젝트 메모 저장 키 - 시리즈명만 쓰면 "기타"처럼 여러 브랜드가 공유하는 이름에서 메모가 서로 덮어써지므로 브랜드까지 합치고,
   *  주차가 바뀌어도 같은 프로젝트면 메모가 계속 따라오지 않도록 해당 보고서의 1주차 시작일(월요일)까지 키에 포함시켜 주차별로 분리 */
  function reportProjectMemoKey_(weekStart, brand, series) {
    return (weekStart || '') + '___' + (brand || '미지정') + '___' + series;
  }

  /** 프로젝트(시리즈)별 하이라이팅 색 - 연두(링크)/빨강(지연, 작업중)과 겹치지 않는 팔레트에서 이름 해시로 고정 배정 */
  var PROJECT_COLOR_COUNT_ = 6;
  function projectColorClass_(series) {
    var s = series || '';
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return 'proj-c' + (h % PROJECT_COLOR_COUNT_);
  }

  /** 프로젝트 메모를 노션처럼 한 줄에 "[] 할 일"을 입력하면 체크박스로 바꿔주는 간단한 체크리스트 에디터.
   *  저장 형식은 평문 + 줄마다 "[ ] 텍스트" / "[x] 텍스트" (체크 안/된 항목) 또는 그냥 일반 텍스트 한 줄. */
  function renderMemoLinesHtml_(text, readonly) {
    var lines = (text || '').split('\n');
    if (lines.length === 1 && lines[0] === '') return '<div class="memo-line"><br></div>';
    return lines.map(function (line) {
      var m = /^\[( |x|X)?\]\s?(.*)$/.exec(line);
      if (m) {
        var checked = (m[1] || '').toLowerCase() === 'x';
        var cbAttrs = 'type="checkbox" class="memo-checkbox"' + (checked ? ' checked' : '') +
          (readonly ? ' disabled' : ' onclick="onReportMemoCheckboxToggle_(event,this)"');
        return '<div class="memo-line"><input ' + cbAttrs + '><span class="memo-line-text' + (checked ? ' done' : '') + '">' + (esc(m[2]) || '<br>') + '</span></div>';
      }
      return '<div class="memo-line">' + (esc(line) || '<br>') + '</div>';
    }).join('');
  }

  /** 타이핑 중 현재 줄이 "[] " 로 시작하면 그 줄을 즉시 체크박스로 변환 (노션의 [] 자동변환과 동일한 동작) */
  function onReportMemoInput_(el) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var node = sel.anchorNode;
    var lineEl = node && node.nodeType === 3 ? node.parentElement : node;
    while (lineEl && lineEl !== el && lineEl.parentElement !== el) lineEl = lineEl.parentElement;
    if (!lineEl || lineEl === el || !lineEl.classList || !lineEl.classList.contains('memo-line')) return;
    if (lineEl.querySelector('.memo-checkbox')) return;
    var text = lineEl.textContent;
    var m = /^\[\]\s(.*)$/.exec(text) || /^\[\]$/.exec(text);
    if (!m) return;
    var rest = m[1] || '';
    lineEl.innerHTML = '<input type="checkbox" class="memo-checkbox" onclick="onReportMemoCheckboxToggle_(event,this)"><span class="memo-line-text"></span>';
    var span = lineEl.querySelector('.memo-line-text');
    span.textContent = rest;
    var range = document.createRange();
    range.selectNodeContents(span);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /** 메모 안의 체크박스를 직접 클릭해서 완료 표시 토글 - 바로 저장까지 함 */
  function onReportMemoCheckboxToggle_(event, checkbox) {
    event.stopPropagation();
    var span = checkbox.nextElementSibling;
    if (span) span.classList.toggle('done', checkbox.checked);
    var container = checkbox.closest('.report-project-memo');
    if (container) saveReportMemoFromEl_(container);
  }

  /** 체크리스트 DOM을 다시 "[ ]"/"[x]" 평문 형식으로 직렬화 */
  function memoDomToText_(el) {
    var lines = [];
    Array.prototype.forEach.call(el.children, function (lineEl) {
      var cb = lineEl.querySelector('.memo-checkbox');
      if (cb) {
        var span = lineEl.querySelector('.memo-line-text');
        lines.push('[' + (cb.checked ? 'x' : ' ') + '] ' + (span ? span.textContent : ''));
      } else {
        lines.push(lineEl.textContent || '');
      }
    });
    return lines.join('\n');
  }

  /** 프로젝트별 메모 저장 (먼데이 아이템과 무관, 브랜드+시리즈+주차 키로 스크립트 속성 저장) */
  function saveReportMemoFromEl_(containerEl) {
    var key = containerEl.dataset.memoKey;
    var val = memoDomToText_(containerEl);
    reportProjectMemos_[key] = val;
    google.script.run.withFailureHandler(function (err) {
      alert('프로젝트 메모 저장 실패: ' + (err.message || err));
    }).setProjectMemo(key, val);
  }

  function onReportProjectMemoBlur_(el) {
    saveReportMemoFromEl_(el);
  }

  function setReportBrandFilter_(brand) {
    reportBrandFilter_ = brand;
    if (reportLastData_) {
      renderReportBrandFilter_(reportLastData_);
      renderReportGrid_(reportLastData_);
      renderReportSummary_(reportLastData_);
    }
  }

  function toggleReportBrand_(brand) {
    reportCollapsedBrands_[brand] = !reportCollapsedBrands_[brand];
    if (reportLastData_) renderReportGrid_(reportLastData_);
  }

  function renderReportBrandFilter_(report) {
    var el = document.getElementById('reportBrandFilter');
    if (!el) return;
    var brandsSet = {};
    (report.items || []).forEach(function (it) { if (it.status !== '보류') brandsSet[it.brand || '미지정'] = true; });
    ((lastData && lastData.meta && lastData.meta.brands) || []).forEach(function (b) { brandsSet[b] = true; });
    REPORT_EXCLUDED_BRANDS_.forEach(function (b) { delete brandsSet[b]; });
    var brands = Object.keys(brandsSet).sort();
    el.innerHTML = ['<button class="report-chip' + (!reportBrandFilter_ ? ' active' : '') + '" onclick="setReportBrandFilter_(null)">전체</button>']
      .concat(brands.map(function (b) {
        return '<button class="report-chip' + (reportBrandFilter_ === b ? ' active' : '') + '" onclick="setReportBrandFilter_(\'' + jsAttrEscape_(b) + '\')">' + esc(b) + '</button>';
      })).join('');
  }

  function renderReportGrid_(report) {
    var todayStr = todayStrClient_();
    var items = reportVisibleItems_(report);
    var wdLabels = ['월', '화', '수', '목', '금'];

    var decorCells = reportDays.map(function (day, idx) {
      var isToday = day === todayStr;
      var cls = [isToday ? 'today' : '', idx === 5 ? 'week-start' : ''].join(' ').trim();
      return '<div class="' + cls + '"></div>';
    }).join('');
    var headCells = reportDays.map(function (day, idx) {
      var isToday = day === todayStr;
      var cls = ['report-grid-head-cell', isToday ? 'today' : '', idx === 5 ? 'week-start' : ''].join(' ').replace(/\s+/g, ' ').trim();
      return '<div class="' + cls + '">' +
        '<span class="wd">' + wdLabels[idx % 5] + '</span>' +
        '<span class="dn">' + Number(day.slice(8, 10)) + '</span>' +
      '</div>';
    }).join('');

    var html = '<div class="report-week-sub"><div class="wk1">이번주</div><div class="wk2">다음주</div></div>' +
      '<div class="report-grid-decor">' + decorCells + '</div>' +
      '<div class="report-grid-head">' + headCells + '</div>';

    if (items.length === 0) {
      html += '<div class="empty" style="padding:24px; position:relative; z-index:1;">해당 2주간 업무가 없습니다.</div>';
      document.getElementById('reportBody').innerHTML = html;
      return;
    }

    // 1차: 브랜드, 2차: 시리즈(프로젝트)
    var byBrand = {};
    var brandOrder = [];
    items.forEach(function (it) {
      var b = it.brand || '미지정';
      if (!byBrand[b]) { byBrand[b] = {}; brandOrder.push(b); }
      var seriesKeys = (it.series && it.series.trim())
        ? it.series.split(',').map(function (s) { return s.trim(); }).filter(Boolean)
        : ['기타'];
      seriesKeys.forEach(function (sk) {
        if (!byBrand[b][sk]) byBrand[b][sk] = [];
        byBrand[b][sk].push(it);
      });
    });
    brandOrder.sort();

    html += brandOrder.map(function (brand) {
      var seriesObj = byBrand[brand];
      var seriesKeys = Object.keys(seriesObj).sort(function (a, b) {
        if (a === '기타') return 1;
        if (b === '기타') return -1;
        return a < b ? -1 : (a > b ? 1 : 0);
      });
      var brandItemCount = seriesKeys.reduce(function (sum, k) { return sum + seriesObj[k].length; }, 0);
      var collapsed = !!reportCollapsedBrands_[brand];

      var projectsHtml = seriesKeys.map(function (sk) {
        var memoKey = reportProjectMemoKey_(report.week1.start, brand, sk);
        var layout = layoutBarsByDayList_(seriesObj[sk], reportDays);
        var trackStyle = 'grid-template-rows: repeat(' + layout.laneCount + ', 24px);';
        var bars = layout.bars.map(function (x) {
          var it = x.it;
          var isDone = it.status === '완료';
          var isInProgress = it.status === '작업 중';
          var isDelay = !isDone && !isInProgress && it.end && it.end < todayStr;
          var isMgmt = it.field === '경영진';
          var cls = 'report-bar2' + (isDone ? ' done' : '') + (isInProgress ? ' inprogress' : '') + (isDelay ? ' delay' : '') + (it.deliverable ? ' has-link' : '') + (isMgmt ? ' mgmt' : '');
          var hoverAttrs = it.deliverable
            ? ' onmouseenter="showLinkPreview(event,\'' + jsAttrEscape_(it.deliverable) + '\')" onmousemove="moveLinkPreview(event)" onmouseleave="hideLinkPreview()"'
            : ' data-tip="' + esc(it.name) + ' · ' + esc(it.start || '-') + ' ~ ' + esc(it.end || '-') + '"';
          var clickMeta = reportItemClickMeta_(it.id, it.deliverable);
          return '<div class="' + cls + '" style="grid-column:' + (x.startIdx + 1) + ' / ' + (x.endIdx + 2) + '; grid-row:' + (x.lane + 1) + '; ' + clickMeta.cursor + '"' + clickMeta.onclickAttr + hoverAttrs + '>' +
            (isDone ? '<i data-lucide="check"></i> ' : '') + esc(it.name) +
          '</div>';
        }).join('');
        var memoText = reportProjectMemos_[memoKey] || '';
        var memoHtml = VIEW_ONLY
          ? (memoText ? '<div class="report-project-memo-ro">' + renderMemoLinesHtml_(memoText, true) + '</div>' : '')
          : '<div class="report-project-memo" contenteditable="true" data-memo-key="' + esc(memoKey) + '" ' +
              'onclick="event.stopPropagation();" oninput="onReportMemoInput_(this)" onblur="onReportProjectMemoBlur_(this)">' +
              renderMemoLinesHtml_(memoText, false) +
            '</div>';
        return '<div class="report-row-project">' +
          '<div class="report-project-head">' +
            '<div class="report-project-cell ' + projectColorClass_(sk) + '">' + esc(sk) + '</div>' +
          '</div>' +
          memoHtml +
          '<div class="report-project-track" style="' + trackStyle + '">' + bars + '</div>' +
        '</div>';
      }).join('');

      return '<div class="report-row-brand' + (collapsed ? ' collapsed' : '') + '" onclick="toggleReportBrand_(\'' + jsAttrEscape_(brand) + '\')">' +
          '<div class="report-brand-cell">' +
            '<span class="report-brand-icon">' + esc(reportInitial_(brand)) + '</span>' +
            '<span class="report-brand-name">' + esc(brand) + '</span>' +
            '<span class="report-brand-count">' + brandItemCount + '</span>' +
          '</div>' +
          '<div class="report-brand-chevron"><i data-lucide="chevron-down"></i></div>' +
        '</div>' +
        '<div class="report-brand-projects' + (collapsed ? ' collapsed' : '') + '">' + projectsHtml + '</div>';
    }).join('');

    document.getElementById('reportBody').innerHTML = html;
  }

  function renderReportSummary_(report) {
    var el = document.getElementById('reportSummary');
    if (!el) return;
    var todayStr = todayStrClient_();
    var items = reportVisibleItems_(report);
    var byBrand = {};
    var brandOrder = [];
    items.forEach(function (it) {
      var b = it.brand || '미지정';
      if (!byBrand[b]) { byBrand[b] = { done: 0, total: 0 }; brandOrder.push(b); }
      byBrand[b].total++;
      if (it.status === '완료') byBrand[b].done++;
    });
    brandOrder.sort();

    var delayed = items.filter(function (it) { return it.status !== '완료' && it.end && it.end < todayStr; });

    el.innerHTML =
      '<div class="report-summary-block">' +
        '<div class="report-summary-h">브랜드별 (아이템 수 / 진행된 수)</div>' +
        (brandOrder.length ? brandOrder.map(function (b) {
          return '<div class="report-summary-brand-row"><span>' + esc(b) + '</span><span class="n">' + byBrand[b].total + ' / ' + byBrand[b].done + '</span></div>';
        }).join('') : '<div class="empty" style="padding:4px 0;">데이터 없음</div>') +
      '</div>' +
      '<div class="report-summary-block">' +
        '<div class="report-summary-h">지연 항목</div>' +
        (delayed.length ? delayed.map(function (it) {
          var clickMeta = reportItemClickMeta_(it.id, it.deliverable);
          return '<div class="report-summary-delay-row"' + (clickMeta.cursor ? ' style="' + clickMeta.cursor + '"' : '') + clickMeta.onclickAttr + '><span class="nm">' + esc(it.name) + '</span><span class="dt">' + esc(fmtShort_(it.end)) + '</span></div>';
        }).join('') : '<div class="empty" style="padding:4px 0;">지연 항목 없음</div>') +
      '</div>';
  }

  function renderTwoWeekReport(report) {
    reportLastData_ = report;
    reportProjectMemos_ = report.projectMemos || {};
    reportWeek1Start = report.week1.start;
    (report.items || []).forEach(function (it) { itemsById[it.id] = it; });
    if (lastData) lastData.schedule.seriesRanges = Object.assign({}, lastData.schedule.seriesRanges, report.seriesRanges);

    reportDays = [];
    for (var i = 0; i < 5; i++) reportDays.push(addDays(report.week1.start, i));
    for (var i = 7; i < 12; i++) reportDays.push(addDays(report.week1.start, i));

    var mondayD = new Date(report.week1.start + 'T00:00:00');
    var month = mondayD.getMonth() + 1;
    var weekOfMonth = Math.ceil(mondayD.getDate() / 7);
    document.getElementById('reportWeekLabel').innerText = month + '월 ' + weekOfMonth + '주차';
    document.getElementById('reportRange').innerText = fmtShort_(reportDays[0]) + ' ~ ' + fmtShort_(reportDays[9]);

    renderReportBrandFilter_(report);
    renderReportGrid_(report);
    renderReportSummary_(report);
    updateReportNextWeekBtnState_();
  }

  /** 공유(보기 전용) 링크에서는 이번주보다 미래 주차로 못 넘어가게 "다음주" 버튼을 비활성화 */
  function updateReportNextWeekBtnState_() {
    var btn = document.getElementById('reportNextWeekBtn');
    if (!btn) return;
    btn.disabled = VIEW_ONLY && reportWeekOffset >= 0;
  }

  function renderCalendar(scheduleData) {
    weekDays = [];
    for (var i = 0; i < 5; i++) weekDays.push(addDays(scheduleData.range.start, i)); // 월~금만

    var todayStr = todayStrClient_();
    var statusClass = { '진행 전': 'st-pending', '작업 중': 'st-progress', '완료': 'st-done' };

    document.getElementById('calHeader').innerHTML = weekDays.map(function (day) {
      return '<div class="cal-head-cell' + (day === todayStr ? ' today' : '') + '">' + dayLabel(day) + '</div>';
    }).join('');

    document.getElementById('calTeachworks').innerHTML = weekDays.map(function (day) {
      var twEvents = (scheduleData.teachworks || []).filter(function (ev) { return ev.date === day; });
      twEvents.sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });
      var chips = twEvents.map(function (ev) {
        return '<div class="tw-chip"><span class="time">' + esc(ev.time || '') + '</span> ' + esc(ev.title) + '</div>';
      }).join('');
      return '<div class="tw-cell">' + (chips || '<span class="empty" style="font-size:11px;">-</span>') + '</div>';
    }).join('');

    // 시리즈별로 그룹 (드롭다운이라 복수 선택 가능 → 콤마로 분리, 미지정은 '기타')
    var groups = {};
    var order = [];
    (scheduleData.items || []).forEach(function (it) {
      var keys = (it.series && it.series.trim())
        ? it.series.split(',').map(function (s) { return s.trim(); }).filter(Boolean)
        : [];
      if (keys.length === 0) keys = ['기타'];
      keys.forEach(function (key) {
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(it);
      });
    });
    function brandOfGroup_(key) {
      return (groups[key][0] && groups[key][0].brand) || '';
    }
    order.sort(function (a, b) {
      if (a === '기타') return -1;
      if (b === '기타') return 1;
      var brandA = brandOfGroup_(a), brandB = brandOfGroup_(b);
      if (brandA !== brandB) return brandA < brandB ? -1 : 1;
      return a < b ? -1 : (a > b ? 1 : 0);
    });

    var sectionsEl = document.getElementById('seriesSections');
    if (order.length === 0) {
      sectionsEl.innerHTML = '<div class="cal-section-label"><i data-lucide="check-circle"></i> 먼데이 업무</div><div class="empty">이번주(월~금) 업무가 없습니다.</div>';
      return;
    }

    sectionsEl.innerHTML = order.map(function (key) {
      var icon = key === '기타' ? '<i data-lucide="check-circle"></i>' : '<i data-lucide="clapperboard"></i>';
      var groupBrand = brandOfGroup_(key);
      var hint = '';
      var label;
      if (key === '기타') {
        label = '<div class="cal-section-label">' + icon + ' 기타' + hint + '</div>';
      } else {
        var periodTxt = '';
        if (scheduleData.seriesRanges && scheduleData.seriesRanges[key]) {
          var r = scheduleData.seriesRanges[key];
          periodTxt = ' <span class="series-range">(' + fmtShort_(r.start) + '~' + fmtShort_(r.end) + ')</span>';
        }
        var brandTag = groupBrand ? '[' + esc(groupBrand) + '] ' : '';
        label = '<div class="cal-section-label">' + icon + ' ' + brandTag + esc(key) + periodTxt + hint + '</div>';
      }
      var layout = layoutBars_(groups[key], weekDays[0]);
      var gridStyle = 'grid-template-rows: repeat(' + layout.laneCount + ', 26px);';
      var seriesArg = key === '기타' ? '' : key;
      var gridClickAttr = ' onclick="onCalGridClick(event,\'' + jsAttrEscape_(seriesArg) + '\',\'' + jsAttrEscape_(groupBrand) + '\')"';

      if (layout.bars.length === 0) {
        return label + '<div class="bar-grid" style="' + gridStyle + '"' + gridClickAttr + '><div class="empty" style="grid-column:1/-1;">업무가 없습니다.</div></div>';
      }

      var bars = layout.bars.map(function (x) {
        var it = x.it;
        var cls = 'cal-bar ' + (statusClass[it.status] || 'st-none');
        return '<div class="' + cls + '" style="grid-column:' + (x.startIdx + 1) + ' / ' + (x.endIdx + 2) + '; grid-row:' + (x.lane + 1) + ';" ' +
          'draggable="true" ondragstart="onBarDragStart(event,\'' + it.id + '\')" ondragend="onBarDragEnd(event)" ' +
          'onclick="openModal(\'' + it.id + '\')" title="' + esc(it.name) + '">' +
          '<span class="n">' + esc(it.name) + '</span>' +
          '<span class="m">' + esc(it.brand || '') + '</span>' +
        '</div>';
      }).join('');

      var seriesAttr = key === '기타' ? '' : esc(key);
      return label + '<div class="bar-grid" data-series="' + seriesAttr + '" style="' + gridStyle + '" ondragover="onCalDragOver(event)" ondragleave="onCalDragLeave(event)" ondrop="onCalDrop(event)"' + gridClickAttr + '>' + bars + '</div>';
    }).join('');
  }

  /** 캘린더 빈 칸(요일 열) 클릭 시 - 그 섹션의 시리즈/브랜드 + 클릭한 요일 일정으로 새 아이템 생성창 오픈 (기존 바 클릭은 수정 모달이 그대로 처리) */
  function onCalGridClick(ev, seriesKey, brand) {
    if (ev.target.closest && ev.target.closest('.cal-bar')) return;
    var cal = ev.currentTarget;
    if (!weekDays.length) return;
    var rect = cal.getBoundingClientRect();
    var colWidth = rect.width / 5;
    var dayIdx = Math.floor((ev.clientX - rect.left) / colWidth);
    if (dayIdx < 0) dayIdx = 0;
    if (dayIdx > 4) dayIdx = 4;
    openQuickCreateFromCal(seriesKey, brand, weekDays[dayIdx]);
  }

  var draggingId = null;

  function onBarDragStart(ev, id) {
    draggingId = id;
    try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', id); } catch (e) {}
    ev.target.classList.add('dragging');
  }
  function onBarDragEnd(ev) {
    ev.target.classList.remove('dragging');
    var overEls = document.querySelectorAll('.bar-grid.drag-over');
    for (var i = 0; i < overEls.length; i++) overEls[i].classList.remove('drag-over');
    draggingId = null;

  function onCalDragOver(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.add('drag-over');
  }
  function onCalDragLeave(ev) {
    ev.currentTarget.classList.remove('drag-over');
  }
  function onCalDrop(ev) {
    ev.preventDefault();
    var cal = ev.currentTarget;
    cal.classList.remove('drag-over');
    var id = draggingId;
    draggingId = null;
    if (!id) return;
    var it = itemsById[id];
    if (!it || !weekDays.length) return;

    var rect = cal.getBoundingClientRect();
    var colWidth = rect.width / 5;
    var dayIdx = Math.floor((ev.clientX - rect.left) / colWidth);
    if (dayIdx < 0) dayIdx = 0;
    if (dayIdx > 4) dayIdx = 4;

    var newStart = weekDays[dayIdx];
    var duration = daysBetween(it.start, it.end || it.start);
    if (duration < 0 || isNaN(duration)) duration = 0;
    var newEnd = addDays(newStart, duration);
    var dateChanged = newStart !== it.start;

    // 드롭한 영역이 특정 시리즈 섹션이면 해당 시리즈로 지정, '기타'(data-series="") 영역이면 시리즈 해제
    var targetSeries = cal.dataset.series || '';
    var currentSeriesList = (it.series || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var seriesChanged = false;
    if (targetSeries === '') {
      if (currentSeriesList.length > 0) { it.series = ''; seriesChanged = true; }
    } else if (currentSeriesList.indexOf(targetSeries) === -1) {
      it.series = targetSeries;
      seriesChanged = true;
    }

    if (!dateChanged && !seriesChanged) return; // 변화 없으면 그대로

    if (dateChanged) { it.start = newStart; it.end = newEnd; }
    recomputeAndRender();

    google.script.run.withFailureHandler(function (err) {
      alert('오류: ' + (err.message || err) + ' (새로고침해서 다시 확인해줘)');
      load();
    }).updateItemFull(id, it.name, it.start, it.end, it.status, it.brand, it.field, it.priority, it.series, it.deliverable);
  }

      applyGanttScheduleChange_(id, from, to);

  /** 현재 ganttItems(로컬 상태) 기준으로 getSeriesSummary와 동일한 모양의 요약을 즉석에서 만듦 (서버 왕복 없이 즉시 다시 그리기용) */
  function buildLocalSeriesSummary_() {
    var items = ganttItems.slice();
    var start = null, end = null;
    var statusCount = {};
    items.forEach(function (it) {
      if (it.start && (!start || it.start < start)) start = it.start;
      var e = it.end || it.start;
      if (e && (!end || e > end)) end = e;
      var st = it.status || '미지정';
      statusCount[st] = (statusCount[st] || 0) + 1;
    });
    items.sort(function (a, b) { return (a.start || '') < (b.start || '') ? -1 : 1; });
    var total = items.length;
    var doneCount = statusCount['완료'] || 0;
    return {
      found: true,
      series: ganttSeriesName,
      total: total,
      start: start,
      end: end,
      statusCount: statusCount,
      percent: total ? Math.round((doneCount / total) * 100) : 0,
      items: items
    };
  }

  /**
   * 간트차트에서 일정을 바꿀 때(모달 저장 또는 드래그앤드롭) 공통으로 쓰는 함수.
   * 같은 프로젝트의 다음 계획들을 연쇄로 밀거나 당기고, 로컬 상태를 즉시 반영한 뒤 서버에 저장함.
   */
  function applyGanttScheduleChange_(itemId, newStart, newEnd) {
    var it = itemsById[itemId];
    if (!it || !newStart) return;
    if (!newEnd || newEnd < newStart) newEnd = newStart;

    var oldEnd = it.end || it.start;
    var deltaEnd = oldEnd ? daysBetween(oldEnd, newEnd) : 0;
    var cascadeUpdates = [];

    if (deltaEnd !== 0 && ganttItems.length) {
      ganttItems.forEach(function (gi) {
        if (String(gi.id) === String(itemId)) return;
        var giStart = gi.start || '';
        if (!giStart || giStart <= oldEnd) return; // 이 아이템보다 나중에 시작하는 "다음 계획"만 연쇄 이동
        var newGiStart = addDays(giStart, deltaEnd);
        var newGiEnd = addDays(gi.end || gi.start, deltaEnd);
        gi.start = newGiStart;
        gi.end = newGiEnd;
        if (itemsById[gi.id]) {
          itemsById[gi.id].start = newGiStart;
          itemsById[gi.id].end = newGiEnd;
        }
        cascadeUpdates.push({ id: gi.id, from: newGiStart, to: newGiEnd });
      });
    }

    it.start = newStart;
    it.end = newEnd;
    ganttItems.forEach(function (gi) {
      if (String(gi.id) === String(itemId)) { gi.start = newStart; gi.end = newEnd; }
    });

    recomputeAndRender();
    if (ganttSeriesName) renderProjectSummary(buildLocalSeriesSummary_());

    google.script.run.withFailureHandler(function (err) {
      alert('오류: ' + (err.message || err) + ' (새로고침해서 다시 확인해줘)');
      load();
    }).updateItemFull(itemId, it.name, newStart, newEnd, it.status, it.brand, it.field, it.priority, it.series, it.deliverable);

    if (cascadeUpdates.length > 0) {
      google.script.run.withFailureHandler(function (err) {
        alert('연쇄 일정 변경 중 오류: ' + (err.message || err) + ' (새로고침해서 다시 확인해줘)');
        load();
      }).bulkUpdateSchedule(cascadeUpdates);
    }
  }

  /** ===================== 간트차트 - 드래그앤드롭으로 일정 변경 ===================== */
  function onGanttBarDragStart(ev, id) {
    ganttDraggingId = id;
    try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', id); } catch (e) {}
    ev.target.classList.add('dragging');
  }
  function onGanttBarDragEnd(ev) {
    ev.target.classList.remove('dragging');
    var overEls = document.querySelectorAll('.gantt-chart-bg.drag-over');
    for (var i = 0; i < overEls.length; i++) overEls[i].classList.remove('drag-over');
    ganttDraggingId = null;
  }
  function onGanttDragOver(ev) {
    ev.preventDefault();
    ev.currentTarget.classList.add('drag-over');
  }
  function onGanttDragLeave(ev) {
    ev.currentTarget.classList.remove('drag-over');
  }
  function onGanttDrop(ev) {
    ev.preventDefault();
    var container = ev.currentTarget;
    container.classList.remove('drag-over');
    var id = ganttDraggingId;
    ganttDraggingId = null;
    if (!id) return;
    var it = itemsById[id];
    if (!it || !ganttChartDays_ || !ganttChartDays_.length) return;

    var rect = container.getBoundingClientRect();
    var totalDays = ganttChartDays_.length;
    var dayWidth = rect.width / totalDays;
    var dayIdx = Math.round((ev.clientX - rect.left) / dayWidth);
    if (dayIdx < 0) dayIdx = 0;
    if (dayIdx > totalDays - 1) dayIdx = totalDays - 1;

    var newStart = ganttChartDays_[dayIdx]; // 주말이 빠진 배열이라 항상 평일로 떨어짐
    if (newStart === it.start) return; // 변화 없음

    // 기존 기간의 영업일 수(주말 제외)를 유지하면서 새 시작일 기준으로 종료일 재계산
    var bizDays = countBusinessDaysClient_(it.start, it.end || it.start);
    var newEnd = addBusinessDaysClient_(newStart, bizDays - 1);

    applyGanttScheduleChange_(id, newStart, newEnd);
  }

    var svg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">' +

  /** select에 해당 value의 option이 없으면 새로 만들어서라도 선택되게 함 (AI가 기존 목록에 없는 값을 제안했을 때 대비) */
  function setSelectValueFlexible_(selectEl, value) {
    if (!value || !selectEl) return;
    selectEl.value = value;
    if (selectEl.value !== value) {
      var opt = document.createElement('option');
      opt.value = value;
      opt.textContent = value + ' (신규)';
      selectEl.insertBefore(opt, selectEl.firstChild);
      selectEl.value = value;
    }
  }

  function renderNotesPreview() {
    var el = document.getElementById('notes-preview');
    if (notesProposals.length === 0) { el.innerHTML = ''; return; }
    var brandOpts = ((lastData && lastData.meta && lastData.meta.brands) || []).map(function (b) { return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('');
    var fieldOpts = ((lastData && lastData.meta && lastData.meta.fields) || []).map(function (f) { return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join('');

    el.innerHTML = notesProposals.map(function (p, idx) {
      return '<div class="notes-row" data-idx="' + idx + '">' +
        '<div class="notes-row-top">' +
          '<input type="checkbox" class="notes-row-check" checked title="포함">' +
          '<input type="text" class="notes-row-name" value="' + esc(p.name) + '" placeholder="아이템명">' +
          '<button type="button" class="qbtn hold" title="삭제" onclick="removeNotesRow(' + idx + ')"><i data-lucide="x"></i></button>' +
        '</div>' +
        '<div class="notes-row-grid">' +
          '<select class="notes-row-brand">' + brandOpts + '</select>' +
          '<select class="notes-row-field">' + fieldOpts + '</select>' +
          '<input type="text" class="notes-row-series wide" placeholder="시리즈(선택)" value="' + esc(p.series) + '">' +
          '<input type="date" class="notes-row-start" value="' + esc(p.start) + '">' +
          '<input type="date" class="notes-row-end" value="' + esc(p.end) + '">' +
        '</div>' +
      '</div>';
    }).join('') + '<button class="primary" id="notes-submit" onclick="submitNotesProposals()">선택한 항목 일괄 추가</button>';

    notesProposals.forEach(function (p, idx) {
      var row = el.querySelector('.notes-row[data-idx="' + idx + '"]');
      if (!row) return;
      setSelectValueFlexible_(row.querySelector('.notes-row-brand'), p.brand);
      setSelectValueFlexible_(row.querySelector('.notes-row-field'), p.field);
    });

  function removeNotesRow(idx) {

  function submitNotesProposals() {
    var rows = document.querySelectorAll('#notes-preview .notes-row');
    var msg = document.getElementById('notes-msg');
    var toCreate = [];
    rows.forEach(function (row) {
      if (!row.querySelector('.notes-row-check').checked) return;
      var name = row.querySelector('.notes-row-name').value.trim();
      var brand = row.querySelector('.notes-row-brand').value;
      var field = row.querySelector('.notes-row-field').value;
      var series = row.querySelector('.notes-row-series').value.trim();
      var start = row.querySelector('.notes-row-start').value;
      var end = row.querySelector('.notes-row-end').value || start;
      if (end < start) end = start;
      if (!name || !brand || !start) return;
      toCreate.push({ name: name, brand: brand, field: field, series: series, start: start, end: end });
    });

    if (toCreate.length === 0) {
      msg.className = 'msg err';
      msg.innerText = '추가할 항목을 선택하고 필수값(아이템명/브랜드/일정)을 채워줘.';
      return;
    }

    var btn = document.getElementById('notes-submit');
    if (btn) btn.disabled = true;
    var total = toCreate.length;
    var failed = [];

    function createNext(i) {
      if (i >= total) {
        if (btn) btn.disabled = false;
        recomputeAndRender();
        if (failed.length === 0) {
          msg.className = 'msg ok';
          msg.innerText = total + '개 아이템 생성 완료.';
          notesProposals = [];
          document.getElementById('notes-preview').innerHTML = '';
          document.getElementById('notes-text').value = '';
        } else {
          msg.className = 'msg err';
          msg.innerText = (total - failed.length) + '/' + total + '개 생성, 실패: ' + failed.join(', ');
        }
        load();
        return;
      }
      var row = toCreate[i];
      msg.className = 'msg';
      msg.innerText = '생성 중... (' + (i + 1) + '/' + total + ')';

      google.script.run
        .withSuccessHandler(function (newId) {
          itemsById[newId] = { id: newId, name: row.name, brand: row.brand, field: row.field, series: row.series, start: row.start, end: row.end, status: '', priority: '' };
          createNext(i + 1);
        })
        .withFailureHandler(function (err) {
          failed.push(row.name);
          createNext(i + 1);
        })
        .createItemWithRange(row.name, row.brand, row.field, row.series, row.start, row.end);
    }

    createNext(0);
  }

  function pkgFieldOptions_() {
    return (lastData && lastData.meta && lastData.meta.fields) || [];
  }

  function renderPkgSteps_(steps) {
    var el = document.getElementById('pkg-step-list');
    var fieldOptions = pkgFieldOptions_();
    el.innerHTML = '';
    if (!steps || steps.length === 0) steps = [{ name: '', days: 1, field: '', parallel: false }];
    steps.forEach(function (s) { el.appendChild(buildPkgStepRow_(s, fieldOptions)); });
    renumberPkgSteps_();
  }

  function buildPkgStepRow_(step, fieldOptions) {
    var row = document.createElement('div');
    row.className = 'pkg-step-row';
    var fieldOpts = '<option value="">분야</option>' + fieldOptions.map(function (f) {
      return '<option value="' + esc(f) + '"' + (f === step.field ? ' selected' : '') + '>' + esc(f) + '</option>';
    }).join('');
    row.innerHTML =
      '<span class="pkg-step-order"></span>' +
      '<input type="text" class="pkg-step-name" value="' + esc(step.name || '') + '" placeholder="아이템명">' +
      '<input type="number" class="pkg-step-days" value="' + (step.days || 1) + '" min="1">' +
      '<select class="pkg-step-field">' + fieldOpts + '</select>' +
      '<label class="pkg-step-parallel-label" title="체크하면 바로 위 단계와 같은 날 동시에 진행돼 (예: 카톡플친 + 슬랙공유를 같은 날에)"><input type="checkbox" class="pkg-step-parallel"' + (step.parallel ? ' checked' : '') + '> 동시</label>' +
      '<button type="button" class="qbtn pkg-move-btn" title="위로" onclick="movePkgStepRow(this,-1)">▲</button>' +
      '<button type="button" class="qbtn pkg-move-btn" title="아래로" onclick="movePkgStepRow(this,1)">▼</button>' +
      '<button type="button" class="qbtn hold" title="삭제" onclick="removePkgStepRow(this)"><i data-lucide="x"></i></button>';
    return row;
  }

  function addPkgStepRow() {
    document.getElementById('pkg-step-list').appendChild(buildPkgStepRow_({ name: '', days: 1, field: '', parallel: false }, pkgFieldOptions_()));
    renumberPkgSteps_();
  }

  function movePkgStepRow(btn, dir) {
    var row = btn.closest('.pkg-step-row');
    if (!row) return;
    if (dir === -1 && row.previousElementSibling) {
      row.parentElement.insertBefore(row, row.previousElementSibling);
    } else if (dir === 1 && row.nextElementSibling) {
      row.parentElement.insertBefore(row.nextElementSibling, row);
    }
    renumberPkgSteps_();
  }

  function removePkgStepRow(btn) {
    var row = btn.closest('.pkg-step-row');
    if (row) row.remove();
    renumberPkgSteps_();
  }

  /** 순서 번호 표시 + 첫 단계는 "동시" 체크를 의미 없게 비활성화 */
  function renumberPkgSteps_() {
    var rows = document.querySelectorAll('#pkg-step-list .pkg-step-row');
    rows.forEach(function (row, idx) {
      var orderEl = row.querySelector('.pkg-step-order');
      if (orderEl) orderEl.textContent = (idx + 1) + '.';
      var checkbox = row.querySelector('.pkg-step-parallel');
      if (checkbox) {
        checkbox.disabled = (idx === 0);
        if (idx === 0) checkbox.checked = false;
      }
    });
  }

  function collectPkgSteps_() {
    var rows = document.querySelectorAll('#pkg-step-list .pkg-step-row');
    var steps = [];
    rows.forEach(function (row, idx) {
      var name = row.querySelector('.pkg-step-name').value.trim();
      var days = parseInt(row.querySelector('.pkg-step-days').value, 10) || 1;
      var field = row.querySelector('.pkg-step-field').value;
      var parallel = idx > 0 && row.querySelector('.pkg-step-parallel').checked;
      if (name) steps.push({ name: name, days: days, field: field, parallel: parallel });
    });
    return steps;
  }

  /** steps: [{name,days,field,parallel}] - parallel=true면 바로 위 단계와 같은 날 시작 (그 그룹 중 가장 늦게 끝나는 단계 다음 영업일에 다음 그룹 시작). 영업일(주말 제외) 기준 - 서버 computePackageSchedule_와 동일 */
  function computePkgScheduleClient_(steps, startDate) {
    var cursor = rollToBusinessDayClient_(startDate);
    var groupStart = null;
    var groupEnd = null;
    var results = [];
    for (var i = 0; i < steps.length; i++) {
      var step = steps[i];
      var days = Math.max(1, Number(step.days) || 1);
      var isParallel = i > 0 && step.parallel && groupStart !== null;
      var thisStart;
      if (isParallel) {
        thisStart = groupStart;
      } else {
        thisStart = cursor;
        groupStart = cursor;
        groupEnd = null;
      }
      var thisEnd = addBusinessDaysClient_(thisStart, days - 1);
      if (groupEnd === null || thisEnd > groupEnd) groupEnd = thisEnd;
      results.push({ step: step, start: thisStart, end: thisEnd });

      var nextIsParallel = (i + 1 < steps.length) && steps[i + 1].parallel;
      if (!nextIsParallel) {
        cursor = addBusinessDaysClient_(groupEnd, 1);
        groupStart = null;
        groupEnd = null;
      }
    }
    return results;
  }

  function savePkgType() {
    var typeName = document.getElementById('pkg-type-name').value.trim();
    if (!typeName) { alert('유형명을 입력해주세요.'); return; }

    if (steps.length === 0) { alert('최소 1개 이상의 단계를 입력해주세요.'); return; }

        refreshPkgCreateSelect_(keys);

  function deletePkgType() {

    if (!confirm('"' + editingPkgType + '" 유형을 삭제할까요?')) return;

  function updatePkgPreview_() {
    var typeSel = document.getElementById('pkg-create-type');
    var dateEl = document.getElementById('p-date');
    var el = document.getElementById('pkg-preview');
    if (!typeSel || !dateEl || !el) return;
    var type = typeSel.value;
    var dateStr = dateEl.value;
    var steps = pkgTemplates[type];
    if (!type || !dateStr || !steps || steps.length === 0) {
      el.style.display = 'none';
      return;
    }
    var schedule = computePkgScheduleClient_(steps, dateStr);
    var lines = schedule.map(function (row) {
      var sameDay = row.start === row.end;
      var rangeTxt = sameDay ? fmtShort_(row.start) : (fmtShort_(row.start) + '~' + fmtShort_(row.end));
      return (row.step.parallel ? '↳ ' : '') + esc(row.step.name) + ' (' + row.step.days + '일, ' + rangeTxt + ')' + (row.step.field ? ' · ' + esc(row.step.field) : '');
    });
    el.innerHTML = '<b>예상 일정</b><br>' + lines.join('<br>');
    el.style.display = 'block';
  }

  /** 간트차트 밑에 체크(완료처리) / 날짜 / 메모를 한 줄씩 나열. 이름 누르면 수정 모달이 열림.
   *  공유(보기 전용) 모드에서는 체크/메모 입력 없이 그냥 보여주기만 함 */
  function renderProjectItemList_(items) {
    if (!items || items.length === 0) return '';
    var rows = items.map(function (it) {
      var dateLabel = (it.start === it.end || !it.end) ? esc(fmtShort_(it.start)) : (esc(fmtShort_(it.start)) + '~' + esc(fmtShort_(it.end)));

      return '<div class="proj-item-row' + (done ? ' done' : '') + '" data-id="' + esc(it.id) + '">' +
        checkHtml +
        '<div class="proj-item-main"' + mainAttrs + '>' +
          '<div class="proj-item-name">' + esc(it.name) + '</div>' +
          '<div class="proj-item-date">' + dateLabel + '</div>' +
        '</div>' +
        memoHtml +
      '</div>';
    }).join('');
    var addBtnHtml = VIEW_ONLY ? '' :
      '<button type="button" class="week-nav-btn proj-item-add-btn" onclick="openQuickCreateForProject_()">+ 아이템 추가</button>';
    return '<div class="proj-item-list">' + rows + '</div>' + addBtnHtml;
  }

  /** 프로젝트 검색(간트차트) 하단 "+ 아이템 추가" 버튼 - 지금 보고 있는 시리즈로 바로 새 아이템 생성 */

  /** 아이템 목록 체크박스 - 완료/진행 전 토글 (기존 ✓ 버튼과 동일하게 완료 처리) */
  function onProjItemCheck(cb, id) {
    var checked = cb.checked;
    var newStatus = checked ? '완료' : '진행 전';
    var prevStatus = checked ? '진행 전' : '완료';

    var gi = ganttItems.filter(function (g) { return String(g.id) === String(id); })[0];
    if (gi) gi.status = newStatus;
    if (itemsById[id]) itemsById[id].status = newStatus;
    if (ganttSeriesName) renderProjectSummary(buildLocalSeriesSummary_());

    google.script.run
      .withFailureHandler(function (err) {
        alert('오류: ' + (err.message || err) + ' (새로고침해서 다시 확인해줘)');
        if (gi) gi.status = prevStatus;
        if (itemsById[id]) itemsById[id].status = prevStatus;
        if (ganttSeriesName) renderProjectSummary(buildLocalSeriesSummary_());

  /** 아이템 목록 메모 입력칸 - 포커스 벗어나면 저장 */
  function onProjItemMemoBlur(input, id) {

    if (gi) gi.memo = val;

      alert('메모 저장 실패: ' + (err.message || err));
    }).updateItemMemo(id, val);

  /** 막대 안에 이름+날짜가 다 안 들어가면, 날짜는 칸 안에 그대로 두고 이름만 빼서 막대 오른쪽 바깥에 적어줌 */
  function adjustGanttBarLabels_(containerEl) {
    containerEl.querySelectorAll('.gantt-bar-label-out').forEach(function (el) { el.remove(); });
    var bars = containerEl.querySelectorAll('.gantt-bar');
    bars.forEach(function (bar) {
      var n = bar.querySelector('.n');
      if (!n) return;
      n.style.visibility = '';
      // 막대(.gantt-bar) 전체의 scrollWidth/clientWidth로 판단하면, 날짜(.r)는 꼭 맞고
      // 이름(.n)만 글자 1~2개+점점점으로 쪼그라든 채로 "안 넘침" 판정이 나는 경우를 놓침.
      // 그래서 이름 칸(.n) 자체가 잘렸는지를 직접 확인함.
      if (n.scrollWidth > n.clientWidth + 1) {
        var leftVal = parseFloat(bar.style.left) || 0;
        var widthVal = parseFloat(bar.style.width) || 0;
        var label = document.createElement('div');
        if (bar.dataset.edgeSide === 'left') {
          // 차트 마지막 5칸 안에서 시작하는 막대는 오른쪽으로 빼면 차트 밖으로 나가버리니 왼쪽으로
          label.className = 'gantt-bar-label-out to-left';
          label.style.right = (100 - leftVal) + '%';
        } else {
          label.className = 'gantt-bar-label-out';
          label.style.left = Math.min(100, leftVal + widthVal) + '%';
        }
        label.textContent = bar.dataset.name || '';
        bar.parentNode.insertBefore(label, bar.nextSibling);
        n.style.visibility = 'hidden';
      }
    });
  }

  /** 프로젝트 전체 기간을 100%로 놓고 각 아이템을 비율 막대로 표시. 완료=초록, 작업중=노랑, 진행 전=하얀, 막힘=핑크, 보류=회색
   *  일별 얇은 세로선 + 실제 달력의 월요일마다 굵은 세로선으로 주 구분, 총 몇 주차 일정인지 표시 */
  /** 간트차트 막대 안의 날짜는 공간이 좁으니 월 없이 "일"만 표시 (위 날짜줄/아래 목록은 그대로 월/일 유지) */
  function dayOnly_(d) {
    if (!d) return '';
    return String(parseInt(d.slice(8, 10), 10));
  }

  /** 분야 이름마다 고정된 색을 배정 (같은 분야는 항상 같은 색) */
  var FIELD_COLOR_COUNT_ = 6;
  function fieldColorClass_(field) {
    var s = field || '';
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return 'field-c' + (h % FIELD_COLOR_COUNT_);
  }

  function renderProjectGantt_(summary) {
    var start = summary.start, end = summary.end;
    if (!start || !end) {
      ganttChartStart_ = '';
      ganttChartTotalDays_ = 0;
      ganttChartDays_ = [];
      return '<div class="empty">기간 정보가 없습니다.</div>';
    }
    // 주말은 타임라인에서 완전히 제거 - 평일만 들어간 날짜 배열 기준으로 위치 계산
    var ganttDays = buildWeekdayDays_(start, end);
    var totalDays = ganttDays.length;
    var dayIndex = {};
    ganttDays.forEach(function (d, i) { dayIndex[d] = i; });
    function snapFwd_(d) {
      var guard = 0;
      while (dayIndex[d] === undefined && d < ganttDays[totalDays - 1] && guard < 10) { d = addDays(d, 1); guard++; }
      return d;
    }
    function snapBwd_(d) {
      var guard = 0;
      while (dayIndex[d] === undefined && d > ganttDays[0] && guard < 10) { d = addDays(d, -1); guard++; }
      return d;
    }

    ganttChartStart_ = start;
    ganttChartTotalDays_ = totalDays;
    ganttChartDays_ = ganttDays;

    var todayStr = todayStrClient_();
    var todayIdx = dayIndex[todayStr];
    var todayPct = (todayIdx !== undefined) ? (todayIdx / totalDays * 100) : null;

    var statusCls = { '완료': 'g-done', '작업 중': 'g-progress', '진행 전': 'g-pending', '막힘': 'g-blocked', '보류': 'g-hold' };

    var items = summary.items.slice().sort(function (a, b) { return (a.start || '') < (b.start || '') ? -1 : 1; });
    var rows = items.map(function (it) {
      if (!it.start) return '';
      var itEnd = it.end || it.start;
      var s = it.start < ganttDays[0] ? ganttDays[0] : it.start;
      var e = itEnd > ganttDays[totalDays - 1] ? ganttDays[totalDays - 1] : itEnd;
      s = snapFwd_(s);
      e = snapBwd_(e);
      if (dayIndex[s] === undefined || dayIndex[e] === undefined || dayIndex[s] > dayIndex[e]) return '';
      var startIdx = dayIndex[s], endIdx = dayIndex[e];
      var leftPct = Math.max(0, startIdx / totalDays * 100);
      var widthPct = Math.max(2, (endIdx - startIdx + 1) / totalDays * 100);
      if (leftPct + widthPct > 100) widthPct = 100 - leftPct;
      var cls = 'gantt-bar ' + (statusCls[it.status] || 'g-pending');
      var fieldInitial = (it.field || '').trim().charAt(0);
      var fieldTagHtml = fieldInitial ? '<span class="bar-field ' + fieldColorClass_(it.field) + '" title="' + esc(it.field) + '">(' + esc(fieldInitial) + ')</span>' : '';
      var dateLabelShort = (it.start === itEnd) ? dayOnly_(it.start) : (dayOnly_(it.start) + '~' + dayOnly_(itEnd));
      // 마지막 5칸 안에서 시작하는 막대는 이름이 넘칠 때 오른쪽이 아니라 왼쪽으로 빠지게 (차트 바깥으로 나갈 수 있어서)
      var edgeSideAttr = (endIdx >= totalDays - 5) ? ' data-edge-side="left"' : '';
      var barInteractiveAttrs = VIEW_ONLY ? '' :
        (' draggable="true" ondragstart="onGanttBarDragStart(event,\'' + it.id + '\')" ondragend="onGanttBarDragEnd(event)" onclick="openModalFromGantt(\'' + it.id + '\')"');
      var barTitle = esc(it.name) + ' (' + esc(it.status || '미지정') + ')' + (VIEW_ONLY ? '' : ' - 드래그해서 일정 이동, 클릭해서 수정/삭제');
      return '<div class="gantt-row">' +
        '<div class="gantt-track">' +
          '<div class="' + cls + '" data-name="' + esc(it.name) + '"' + edgeSideAttr + ' style="left:' + leftPct + '%; width:' + widthPct + '%;"' +
            barInteractiveAttrs + ' title="' + barTitle + '">' +
            fieldTagHtml +
            '<span class="r">' + dateLabelShort + '</span>' +
            '<span class="n">' + esc(it.name) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // 평일 칸마다 얇은 세로선 + 월요일마다 굵은 세로선(주 경계), 몇 주차 분량인지 계산 (주말이 빠졌으니 5평일=1주 기준)
    var dayLines = '';
    var weekCount = 0;
    for (var i = 0; i <= totalDays; i++) {
      var leftPct2 = i / totalDays * 100;
      var isWeekBoundary = false;
      if (i < totalDays) {
        isWeekBoundary = (i === 0) || (dayOfWeekClient_(ganttDays[i]) === 1);
        if (isWeekBoundary) weekCount++;
      }
      dayLines += '<div class="gantt-day-line' + (isWeekBoundary ? ' week' : '') + '" style="left:' + leftPct2 + '%;"></div>';
    }
    var totalWeeks = Math.max(weekCount, Math.ceil(totalDays / 5));
    var weekInfoHtml = '<div class="gantt-week-info">총 ' + totalWeeks + '주차 일정 (' + esc(fmtShort_(start)) + ' ~ ' + esc(fmtShort_(end)) + ', 평일 기준)</div>';

    // 각 평일 칸 위에 날짜(MM/DD) 표시 - 월요일(주 경계)은 진하게, 오늘은 강조 표시
    // (예전엔 "오늘" 텍스트를 차트 위로 따로 띄워서 이 날짜 줄이랑 겹쳤음 - 이제 이 줄 안에서 오늘 날짜를 강조하는 걸로 대체)
    var dateLabels = '';
    for (var di = 0; di < totalDays; di++) {
      var centerPct = (di + 0.5) / totalDays * 100;
      var isMonCol = dayOfWeekClient_(ganttDays[di]) === 1;
      var isTodayCol = ganttDays[di] === todayStr;
      dateLabels += '<div class="gantt-date-label' + (isMonCol ? ' week' : '') + (isTodayCol ? ' today' : '') + '" style="left:' + centerPct + '%;">' + esc(fmtShort_(ganttDays[di])) + '</div>';
    }
    var dateRowHtml = '<div class="gantt-date-row">' + dateLabels + '</div>';

    // 오늘 칸은 위 날짜줄의 "오늘" 배지와 같은 색으로 세로 전체를 칠함 (예전엔 얇은 선 1개라 눈에 잘 안 띔)
    var todayColHtml = (todayIdx !== undefined)
      ? '<div class="gantt-today-col" style="left:' + todayPct + '%; width:' + (100 / totalDays) + '%;"></div>'
      : '';
    var chartDragAttrs = VIEW_ONLY ? '' : ' ondragover="onGanttDragOver(event)" ondragleave="onGanttDragLeave(event)" ondrop="onGanttDrop(event)"';

    return weekInfoHtml + dateRowHtml + '<div class="gantt-chart-bg"' + chartDragAttrs + '>' +
      todayColHtml + dayLines +
      '<div class="gantt-today-line">' + rows + '</div>' +
    '</div>';
  }

  // renderSparkles(); // 클린 대시보드 톤으로 변경하며 별 장식 비활성화
  if (IS_SHARED_VIEW) {
    // 공유 링크로 들어온 경우: 개인 전체 대시보드(오늘 업무/스케쥴 등)는 절대 불러오지 않고
    // 보고서/아이템 화면만 바로 표시 (서버에서도 getDashboardData 호출 자체를 토큰으로 막음)
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    applyDeepLinkIfNeeded_();
  } else {
    load();
    applyDeepLinkIfNeeded_();
  }
</script>
</body>
</html>
